<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuesta del cinturón</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#1a120c;color:#f3e6cf;font:15px system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.tabs{display:flex;gap:4px;padding:4px;flex-wrap:nowrap;overflow:hidden}
.tabs button{flex:1;min-height:48px;min-width:0;border:1px solid #6b4a2a;border-radius:8px;background:#2a1c12;color:#f3e6cf;font:600 14px system-ui;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs button.elegido{border-color:#e9b25a;color:#ffd98a}
.tabs button.on{background:#5a3a1c;border-color:#e9b25a;color:#ffd98a}
.tabs button .v{color:#7fd17f}
@media (max-width:640px){.tabs{flex-wrap:wrap}.tabs button{flex:1 1 30%}}
iframe{flex:1;border:0;width:100%;background:#000}
.bar{display:flex;gap:6px;align-items:center;padding:4px 6px}
.bar .t{flex:1;font-size:14px;line-height:1.2}
.voto{min-height:48px;padding:0 16px;border:0;border-radius:10px;background:#f08a24;color:#1a0f05;font:700 15px system-ui}
.sec{min-height:48px;padding:0 14px;border:1px solid #6b4a2a;border-radius:10px;background:#2a1c12;color:#f3e6cf;font:600 14px system-ui}
</style></head><body><div class="app">
<div class="tabs" id="tabs"></div>
<iframe id="fr" title="Modelo"></iframe>
<div class="bar"><div class="t" id="t"></div><button class="sec" id="sig">Siguiente</button><button class="voto" id="vot">Elegir este</button></div>
</div>
<script>
const M=[['cinturon_final.html','Elegido por el dueño'],['modelo1.html','1 · Mesa de póker'],['modelo2.html','2 · Tambor'],['modelo3.html','3 · Tragamonedas'],['modelo4.html','4 · Cartuchera'],['modelo5.html','5 · Tablero'],['modelo6.html','6 · Expendedora']];
let i=0,v=null;try{v=localStorage.getItem('enc_cinturon2')}catch(e){}
const tabs=document.getElementById('tabs'),fr=document.getElementById('fr'),t=document.getElementById('t');
function pinta(){tabs.innerHTML='';M.forEach((m,k)=>{const b=document.createElement('button');b.className=(k===i?'on':'')+(k===0?' elegido':'');b.innerHTML=(v==k?'<span class="v">Tu voto: </span>':'')+m[1];b.onclick=()=>{i=k;ir()};tabs.appendChild(b)});
t.textContent=v!==null&&v!==undefined&&v!==''?('Tu elección: '+M[+v][1]+'. Pruébalos todos y dime en el chat cuál elegiste (o una mezcla).'):'Prueba cada modelo y toca «Elegir este» en el que más te guste.'}
function ir(){fr.src=M[i][0];pinta()}
document.getElementById('sig').onclick=()=>{i=(i+1)%M.length;ir()};
document.getElementById('vot').onclick=()=>{v=String(i);try{localStorage.setItem('enc_cinturon2',v)}catch(e){}pinta()};
ir();
</script></body></html>
