<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 2 · Tambor giratorio</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css"><script src="fichas.js"></script><script src="vivo.js"></script>
<style>
.lay{flex:1;display:flex;gap:calc(var(--gap)*2);min-height:0;align-items:stretch}
.drumbox{flex:none;height:100%;aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center;container-type:size;--R:33cqmin}
.rot{position:absolute;inset:0}
.drum{position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9aa3ab,#5b6168 45%,#2c3035 75%);box-shadow:0 0 0 6px #1b1d20,0 0 0 9px var(--brass-d),0 10px 30px #000a,inset 0 0 30px #000b}
.drum::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px dashed #ffd27a55;animation:spin 14s linear infinite}
.ch{position:absolute;left:50%;top:50%;width:calc(var(--ch) + 14px);height:calc(var(--ch) + 14px);margin:calc((var(--ch) + 14px)/-2);border-radius:50%;background:radial-gradient(#111 55%,#2a2d31 70%);box-shadow:inset 0 3px 8px #000;display:flex;align-items:center;justify-content:center;
  transform:rotate(var(--a)) translateY(calc(var(--R) * -1)) rotate(calc(var(--a) * -1))}
.ch.vacio::after{content:"";width:60%;height:60%;border-radius:50%;border:2px dashed #ffffff40}
.core{position:absolute;left:50%;top:50%;width:calc(var(--ch)*1.6);height:calc(var(--ch)*1.6);margin:calc(var(--ch)*-.8);border-radius:50%;background:radial-gradient(#1b2a3a,#08111a);box-shadow:0 0 0 3px var(--cc,#ffd27a66),0 0 26px var(--cc,#0000);display:flex;align-items:center;justify-content:center;transition:box-shadow .3s;z-index:2}
.core .f{transform:scale(1.15)}.core .prev{opacity:.5}
.core .vac{font-size:14px;color:var(--bone-dim);text-align:center;line-height:1.1;padding:4px}
.core .q{font:400 34px var(--display);color:#b67cff}
.core .rays{display:none}.core.brilla .rays{display:block}
.side{flex:1;display:flex;flex-direction:column;gap:var(--gap);min-width:0;min-height:0}
.card{display:flex;gap:12px;align-items:center;min-height:calc(var(--ch) + 16px)}
.card h2{font:400 clamp(18px,3.4vh,26px) var(--display);color:#6fd3f0;white-space:nowrap}
.row{display:flex;align-items:center;gap:10px;padding:6px 10px}
.row .lbl{width:5.2em;white-space:normal;line-height:1.1;flex:none}
.ammo{display:flex;gap:4px;align-items:center;--ch:clamp(40px,9vh,64px)}
.ammo .slot{width:calc(var(--ch) + 4px);height:calc(var(--ch) + 4px)}
.pila{display:flex;align-items:center;min-width:var(--ch);min-height:var(--ch);border-radius:50%}.pila .f{margin-right:calc(var(--ch)*-.6)}.pila .f:last-child{margin-right:0}
.side .btn.main{margin-top:auto}
.arrow{position:absolute;inset:-2%;pointer-events:none}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px}.top h1{flex-basis:100%;order:-1}.top .lbl{display:none}
  :root{--ch:clamp(40px,10.5vw,56px)}
  .lay{flex-direction:column;gap:var(--gap)}
  .drumbox{height:auto;width:min(100%,44vh);align-self:center}
  .ammo{--ch:clamp(36px,9.6vw,46px)}.row .lbl{width:4.6em}.side .pc-only{display:none!important}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Tambor de balas</h1><span class="lbl">Elige 2 y gira</span><span class="sp"></span><span id="pills"></span><button class="btn" id="bReiniciar">Reiniciar</button></div>
<div class="lay">
 <div class="drumbox">
  <div class="rot" id="rot"></div>
  <svg class="arrow" viewBox="0 0 100 100"><path d="M50 3 A47 47 0 0 1 93 33" fill="none" stroke="#ffd27a" stroke-width="2" stroke-linecap="round"/><path d="M93 33 l-6 -1 M93 33 l1 -6" stroke="#ffd27a" stroke-width="2" stroke-linecap="round"/></svg>
  <div class="core" id="core" data-drop="centro"></div>
 </div>
 <div class="side">
  <div class="card panel" id="card"></div>
  <div class="row panel"><div class="lbl">Bolsillo <b id="cBol"></b></div><div class="ammo"><span id="bol"></span><span class="txt" id="tBol"></span></div></div>
  <div class="row panel"><div class="lbl">Inventario <b id="cInv"></b></div><div class="ammo" id="inv"></div></div>
  <div class="panel pc-only" id="lad"></div>
  <button class="btn main" id="bGirar">Girar y juntar · 1 ficha</button>
 </div>
</div></div>
<script>
let sel = [], mostrar = null, foco = 'cin:1';
const mesa = document.querySelector('.frame');
function orden() { const [a, b] = sel; if (a === 'bol') return [a, b]; if (b === 'bol') return [b, a]; if (a.startsWith('cin') && !b.startsWith('cin')) return [b, a]; return [a, b]; }
function render() {
  sel = sel.filter(l => Z.get(l));
  $('#pills').innerHTML = pastillas();
  $('#rot').innerHTML = '<div class="drum"></div>' + Z.e.cin.map((x, i) => `<div class="ch${x ? '' : ' vacio'}" style="--a:${i * 45}deg" data-loc="cin:${i}">${x ? ficha(x.id, x.nv, { pair: Z.pareja('cin:' + i) }) : ''}</div>`).join('');
  $('#inv').innerHTML = Z.e.inv.map((_, i) => hueco('inv:' + i)).join('');
  $('#bol').innerHTML = bolsilloHTML(); $('#tBol').textContent = Z.e.bol ? '×' + Z.e.bol.nv + ' · +' + Z.e.bol.nv * 20 + ' %' : 'vacío';
  $('#cInv').textContent = cuenta('inv'); $('#cBol').textContent = (Z.e.bol ? Z.e.bol.nv : 0) + '/5';
  sel.forEach(l => locEl(l)?.classList.add('elegida'));
  const core = $('#core'); let h = '<div class="rays"></div>', ok = false, cc = '';
  let it = mostrar || (Z.get(foco) ? Z.get(foco) : null), titulo = '', txt = '';
  if (mostrar) { h += ficha(mostrar.id, mostrar.nv); cc = brillo(mostrar.id); }
  else if (sel.length === 2) {
    const [s, d] = orden(), r = Z.combinar(Z.get(s), Z.get(d));
    if (r.err) { h += `<span class="vac">No se juntan</span>`; txt = r.err; }
    else { ok = true; cc = brillo(r.id); if (r.tipo === 'fusion' && !Z.conocida(r.id)) { h += '<span class="q">?</span>'; it = null; titulo = 'Fusión nueva'; txt = nombre(Z.get(s).id) + ' + ' + nombre(Z.get(d).id) + ' · pruébala'; } else { h += `<span class="prev">${ficha(r.id, r.nv)}</span>`; it = { id: r.id, nv: r.nv }; } }
  } else if (sel.length === 1) { const x = Z.get(sel[0]); h += `<span class="prev">${ficha(x.id, x.nv)}</span>`; cc = brillo(x.id); it = x; }
  else h += '<span class="vac">Toca 2 balas</span>';
  core.innerHTML = h; core.style.setProperty('--cc', cc || '#ffd27a66'); if (!mostrar) core.classList.remove('brilla');
  if (it) { titulo = `${nombre(it.id)} · Nv ${it.nv}`; txt = `${queHace(it.id, it.nv)} <small>· ${RNOM[rareza(it.id)]}</small>`; }
  $('#card').innerHTML = (it ? ficha(it.id, it.nv) : '<span class="slot"></span>') + `<div><h2 style="color:${it ? brillo(it.id) : '#b67cff'}">${titulo || 'Elige 2 balas'}</h2><div class="txt">${txt || 'Iguales suben de nivel; distintas pueden fusionarse'}</div></div>`;
  $('#lad').innerHTML = it ? `<div class="lbl" style="margin-bottom:6px">Niveles de ${nombre(it.id)}</div>` + escalera(it.id, it.nv) : '';
  $('#bGirar').disabled = !ok || !!mostrar;
}
function elegir(l) { foco = l; if (sel.includes(l)) { sel = sel.filter(x => x !== l); Son.clic(); } else { if (sel.length === 2) sel.shift(); sel.push(l); Son.martillo(); } render(); FX.rebote(fichaEl(l), 1.2); }
arrastre(mesa, {
  alTocar(k) { if (k.startsWith('drop:')) return; if (Z.get(k)) elegir(k); },
  alPasar(a, b) { if (b === 'drop:centro') return 'Al centro'; if (b === 'bol') return Z.e.bol && Z.e.bol.id === Z.get(a).id ? 'Apilar' : Z.e.bol ? '' : 'Guardar'; return Z.get(b) ? 'Cambiar' : 'Mover'; },
  alSoltar(a, b) {
    if (b === 'drop:centro') { if (!sel.includes(a)) elegir(a); return; }
    const r = Z.mover(a, b); if (r.err) { if (r.err) FX.toast(r.err, true); return; }
    sel = sel.map(x => x === a ? b : x === b ? a : x); foco = b; render(); FX.rebote(fichaEl(b), 1.2); if (r.ok === 'apilar') { Son.ficha(); FX.flotar(fichaEl(b), 'Bolsillo ×' + r.item.nv, '#e86fae'); } else Son.clic();
  },
});
$('#bGirar').onclick = async () => {
  if (sel.length < 2) return; const [s, d] = orden(), antes = foto(); $('#bGirar').disabled = true;
  const A = Z.get(s), B = Z.get(d);
  Son.girar(16, 95);
  await $('#rot').animate([{ transform: 'rotate(0)' }, { transform: 'rotate(720deg)' }], { duration: 1600, easing: 'cubic-bezier(.25,0,.2,1)' }).finished;
  Son.martillo(); const core = $('#core'); core.classList.add('brilla');
  await Promise.all([FX.volar(fichaEl(s), core, ficha(A.id, A.nv), { color: brillo(A.id), arco: -30 }), FX.volar(fichaEl(d), core, ficha(B.id, B.nv), { color: brillo(B.id), arco: 30 })]);
  const r = Z.juntar(s, d); if (r.err) { FX.toast(r.err, true); render(); return; }
  sel = []; mostrar = r.item; foco = d; render(); core.classList.add('brilla'); contarPastillas(antes);
  await celebrar(core, r); await espera(1200);
  const de = core.querySelector('.f'); mostrar = null; render();
  await FX.volar(de || core, fichaEl(d), ficha(r.item.id, r.item.nv), { color: brillo(r.item.id) });
  const el = fichaEl(d); Son.clac(); FX.rebote(el, 1.3); FX.estallido(el, brillo(r.item.id), 10);
};
botonReiniciar(() => { sel = []; mostrar = null; foco = 'cin:1'; render(); });
render();
</script></body></html>
