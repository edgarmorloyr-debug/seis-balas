<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selección 1 · Pasaporte con sellos</title>
<link rel="stylesheet" href="seleccion.css">
<style>
/* Propuesta 1 · Pasaporte con sellos: la página abierta de un pasaporte del Oeste. Al cambiar de personaje la página entra
   deslizándose y cae un sello: «APROBADO» (verde) si se puede elegir, «BLOQUEADO» (rojo) si no. */
body{background:radial-gradient(110% 90% at 50% 35%,#3b2414 0%,#20130a 70%,#140b05 100%)}
.libro{width:100%;padding:10px;border-radius:16px;background:linear-gradient(135deg,#5a1622,#3a0c14);box-shadow:0 12px 30px #000a,inset 0 0 0 2px #c9a24a66}
.pp{max-height:none;background:
  repeating-radial-gradient(circle at 15% 30%,#00000000 0 7px,#8a6a3a14 7px 8px),
  repeating-radial-gradient(circle at 85% 70%,#00000000 0 9px,#3a6a6a12 9px 10px),
  linear-gradient(#f6eedb,#ecdfc1);color:#24180c;border-radius:10px;padding:14px 16px;overflow:hidden;box-shadow:inset 0 0 30px #a0805044}
.pp::before{content:"";position:absolute;inset:6px;border:1.5px solid #8a6a3a66;border-radius:7px;pointer-events:none}
.foto{border:6px solid #fff;box-shadow:0 2px 6px #0005;transform:rotate(-1deg)}
.foto::after{content:"";position:absolute;right:-26px;bottom:-26px;width:80px;height:80px;border-radius:50%;border:3px double #6b2a8a88;background:radial-gradient(circle,#6b2a8a22 30%,transparent 31%)}
.tira{display:flex;justify-content:space-between;gap:8px;font:700 14px var(--hud);letter-spacing:2px;text-transform:uppercase;color:#5a1622;border-bottom:1.5px solid #5a162255;padding-bottom:3px}
.nombre{color:#1d120a}
.campos dt{color:#5a4630}
.campos dd{color:#1d120a}
.jefes{color:#a3122a}
.req{color:#a3122a}
.cel{border:1.5px solid #8a6a3a77;border-radius:8px;background:#fffaf0aa}
.cel.pas h3{color:#145a52}.cel.ult h3{color:#7a4a00}
.cel p{color:#24180c}
.est div{border:1.5px dashed #8a6a3a88;border-radius:8px;background:#fffaf080}
.est b{color:#1d120a}.est small{color:#5a4630}
.mrz{grid-column:1/-1;font:700 15px/1 var(--mono);letter-spacing:2px;color:#3a2c1c;white-space:nowrap;overflow:hidden;text-align:center;opacity:.85}
.pp{grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"foto cab" "hab hab" "est est" "mrz mrz"}
.mrz{grid-area:mrz}
/* sellos de visa de adorno (no tapan texto: van detrás y muy claros) */
.visa{position:absolute;pointer-events:none;font:700 14px/1 var(--hud);letter-spacing:2px;text-transform:uppercase;border:3px solid currentColor;border-radius:50%;width:110px;height:110px;display:flex;align-items:center;justify-content:center;text-align:center;opacity:.13}
.visa.a{color:#1a4a8a;right:18px;top:14px;transform:rotate(14deg)}
.visa.b{color:#7a1a2a;right:150px;top:40px;transform:rotate(-10deg);border-radius:10px;width:130px;height:62px}
/* el sello que cae al cambiar */
.sello{grid-area:foto;align-self:start;justify-self:center;position:relative;z-index:3;margin-top:calc(clamp(150px,36vh,260px) * .42);font:400 24px/1 var(--display);letter-spacing:2px;padding:6px 12px;border:4px double currentColor;border-radius:8px;transform:rotate(-10deg);pointer-events:none;text-transform:uppercase;white-space:nowrap;background:#f6eedbd9;box-shadow:0 0 0 2px #f6eedb99}
.sello.ok{color:#1e6a34;margin-right:-30%;margin-top:calc(clamp(150px,36vh,260px) * .8);background:#f6eedb99}
.sello.no{color:#b3122a}
.pp .foto .candado{display:none}
.cambia .pp{animation:entra .35s ease-out}
.cambia.izq .pp{animation-name:entraI}
.cambia .sello{animation:sella .5s .3s cubic-bezier(.2,1.6,.4,1) both}
.cambia .libro{animation:golpe .25s .62s ease-out}
@keyframes entra{from{transform:translateX(50px);opacity:0}to{transform:none;opacity:1}}
@keyframes entraI{from{transform:translateX(-50px);opacity:0}to{transform:none;opacity:1}}
@keyframes sella{0%{transform:rotate(-30deg) scale(2.6);opacity:0}60%{opacity:1}100%{transform:rotate(-10deg) scale(1);opacity:1}}
@keyframes golpe{0%,100%{transform:none}40%{transform:translateY(3px) scale(.995)}}
.mini img{border:3px solid #f3e9d2;border-radius:3px;background:#f3e9d2}
.mini.on img{border-color:var(--gold)}
@media (orientation:landscape) and (max-height:520px){
  .libro{padding:6px;height:100%}.pp{padding:8px 12px}
  .pp{grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"foto cab" "foto hab" "foto est"}
  .mrz,.visa.b{display:none}
  .sello{align-self:end;margin:0 0 14%}.sello.ok{margin:0 0 10px}
  .foto::after{display:none}
}
@media (orientation:portrait){
  .libro{padding:6px}.pp{padding:10px}
  .visa{display:none}
  .tira{letter-spacing:1px}
  .sello{font-size:17px;padding:4px 8px;margin-top:62px}.sello.ok{margin-right:0;margin-top:112px}
  .tira span:last-child{display:none}
  .mrz{font-size:14px;letter-spacing:0}
  .tira span:first-child{letter-spacing:1px}
}
</style></head><body>
<main class="pg">
  <header class="top"><h1>Elige tu personaje</h1></header>
  <section id="doc" aria-live="polite"></section>
  <div class="bar"><button class="btn" id="volver">Volver</button><nav id="fila" aria-label="Personajes"></nav><button class="btn main" id="elegir">Elegir</button></div>
</main>
<script>
window.SEL = {
  pinta: c => { const H = SELH; return `<div class="libro"><div class="pp">
    <i class="visa a">Aduana<br>del Oeste</i><i class="visa b">Saloon 1885</i>
    ${H.foto(c)}
    <div class="cab"><div class="tira"><span>Pasaporte del Oeste</span><span>Nº ${c.num}</span></div>
      <div class="nombre">${c.name}</div>
      <dl class="campos"><dt>Arma</dt><dd>${H.arma(c)}</dd><dt>Vida</dt><dd>${c.vida}</dd>${c.jefes == null ? '' : `<dt>Jefes del casino</dt><dd>${H.jefes(c)}</dd>`}</dl>
      ${H.req(c)}</div>
    ${H.hab(c)}${H.est(c)}<div class="mrz" aria-hidden="true">${H.mrz(c)}&lt;&lt;&lt;&lt;${c.num}</div>
    <div class="sello ${c.open ? 'ok' : 'no'}" aria-hidden="true">${c.open ? 'Aprobado' : 'Bloqueado'}</div>
  </div></div>`; }
};
</script>
<script src="seleccion.js"></script>
</body></html>
