<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selección 5 · Control de paso</title>
<link rel="stylesheet" href="seleccion.css">
<style>
/* Propuesta 5 · Control de paso: el escritorio del guardia de la frontera, con su lámpara. El pasaporte abierto se desliza
   sobre la mesa: página izquierda con la foto y los datos, página derecha con la pasiva y la ultimate, y abajo, cruzando las
   dos páginas, las 5 cifras del arma. El guardia sella «PASA» o «NO PASA». La fila de abajo es la fila de gente esperando. */
body{background:linear-gradient(#1b1410 0 13%,#0000 13%),repeating-linear-gradient(90deg,#00000022 0 3px,#0000 3px 140px),linear-gradient(#5a3a1e,#43280f 60%,#2e1a08)}
.top{flex-direction:column;gap:2px}
.letrero{display:flex;flex-direction:column;align-items:center;background:linear-gradient(#6a4520,#4a2e12);border:3px solid #2a1806;border-radius:8px;padding:4px 26px;box-shadow:0 6px 12px #0009,inset 0 0 0 2px #c9a05a55}
.letrero small{font:700 14px var(--hud);letter-spacing:3px;text-transform:uppercase;color:#f2d9a8}
.letrero h1{font-size:clamp(20px,3.6vh,28px)}
#doc::before{content:"";position:absolute;inset:-10% 5%;background:radial-gradient(closest-side,#ffe9b044,#ffe9b014 60%,#0000);pointer-events:none}
.libreta{position:relative;width:100%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"izq der" "est est";gap:0;padding:10px;border-radius:14px;background:#163a2c;box-shadow:0 16px 30px #000c,inset 0 0 0 2px #c9b46a55;color:#14231c}
.pag{background:repeating-linear-gradient(-45deg,#0000 0 10px,#2a6a5014 10px 11px),linear-gradient(#eef5ec,#dde9dc);padding:12px 14px;min-height:0;position:relative}
.pag.izq{grid-area:izq;border-radius:8px 0 0 0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;box-shadow:inset -10px 0 14px -10px #0005}
.pag.izq .foto,.pag.izq .cab{grid-area:auto}
.pag.der{grid-area:der;border-radius:0 8px 0 0;box-shadow:inset 10px 0 14px -10px #0005;display:flex;min-height:0}
.libreta .est{grid-area:est;background:linear-gradient(#dde9dc,#d3e2d2);border-radius:0 0 8px 8px;padding:8px 14px 10px;gap:8px}
.foto{height:clamp(150px,30vh,220px);border:2px solid #14231c;box-shadow:0 0 0 4px #eef5ec,0 0 0 6px #2a6a5066}
.foto img{filter:grayscale(1) contrast(1.1) sepia(.15)}
.cab .tit{font:700 14px var(--hud);letter-spacing:2px;text-transform:uppercase;color:#1d5a44;display:flex;justify-content:space-between;gap:8px}
.nombre{color:#0f1d17}
.campos{grid-template-columns:1fr}
.campos dt{color:#3a5a4c;font-size:14px}
.campos dd{color:#0f1d17;margin-bottom:2px}
.jefes{color:#a3122a}
.req{color:#a3122a}
.hab{grid-template-columns:1fr;grid-template-rows:1fr 1fr;width:100%}
.cel{background:#fbfdf9b0;border:1.5px solid #2a6a5088;border-radius:8px}
.cel.pas h3{color:#0f5a52}.cel.ult h3{color:#7a3a00}
.cel p{color:#14231c}
.est div{background:#fbfdf9;border-radius:8px;border:1.5px solid #2a6a5088}
.est small{color:#3a5a4c}
.sello{position:absolute;left:50%;bottom:10%;z-index:3;font:400 20px/1 var(--display);padding:5px 10px;border:4px solid currentColor;border-radius:50% / 40%;transform:translateX(-50%) rotate(-14deg);pointer-events:none;text-transform:uppercase;white-space:nowrap;background:#eef5ece0}
.arma span{white-space:normal}
.sello.ok{color:#1d6a3a}.sello.no{color:#b3122a}
.cambia .libreta{animation:desliza .55s cubic-bezier(.2,1.1,.4,1)}
.cambia.izq .libreta{animation-name:deslizaI}
.cambia .sello{animation:sella .4s .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes desliza{from{transform:translateX(70%) rotate(8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes deslizaI{from{transform:translateX(-70%) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
@keyframes sella{0%{transform:translateX(-50%) rotate(-30deg) scale(2.4);opacity:0}70%{opacity:1}100%{transform:translateX(-50%) rotate(-14deg) scale(1);opacity:1}}
/* la fila de gente esperando: un mostrador de madera */
#fila{background:linear-gradient(#2a1a0c,#1a0f06);border:2px solid #6a4520;border-radius:10px;padding:8px 10px}
.mini img{border-radius:50% 50% 8px 8px;border:2px solid #6a4520}
.mini.on img{border-color:var(--gold)}
.mini .nm{color:#f2d9a8}
@media (orientation:landscape) and (max-height:520px){
  .libreta{height:100%;padding:6px}
  .pag{padding:8px 10px}
  .pag.izq{gap:10px}
  .foto{height:auto;width:120px;aspect-ratio:4/5}
  .cab{gap:2px}.cab .nombre{font-size:22px}
  .campos{grid-template-columns:auto minmax(0,1fr);gap:1px 8px}
  .campos dt:first-of-type,.campos dd:first-of-type{grid-column:auto}
  .campos dd{font-size:15px;margin:0}
  .arma img{display:none}
  .libreta .est{padding:6px 10px 8px;gap:6px}
  .cel h3 small{display:block}
  .sello{font-size:15px;padding:3px 7px;border-width:3px}
  #fila{padding:4px 8px}
}
@media (orientation:portrait){
  .top{min-height:0}
  .letrero{padding:3px 16px}
  .letrero h1{font-size:22px}
  .libreta{grid-template-columns:1fr;grid-template-rows:auto auto auto;grid-template-areas:"izq" "der" "est";padding:6px}
  .pag.izq{border-radius:8px 8px 0 0;box-shadow:inset 0 -10px 14px -10px #0005;padding:10px}
  .pag.der{border-radius:0;box-shadow:inset 0 10px 14px -10px #0005;padding:10px}
  .hab{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .foto{height:150px}
  .libreta .est{padding:6px 8px 8px;gap:4px}
  .sello{font-size:16px;padding:3px 8px;border-width:3px}
  #fila{padding:8px 10px}
}
</style></head><body>
<main class="pg">
  <header class="top"><div class="letrero"><small>Control de paso</small><h1>Elige tu personaje</h1></div></header>
  <section id="doc" aria-live="polite"></section>
  <div class="bar"><button class="btn" id="volver">Volver</button><nav id="fila" aria-label="Personajes"></nav><button class="btn main" id="elegir">Elegir</button></div>
</main>
<script>
window.SEL = {
  pinta: c => { const H = SELH; return `<div class="libreta">
    <div class="pag izq">${H.foto(c, `<div class="sello ${c.open ? 'ok' : 'no'}" aria-hidden="true">${c.open ? 'Pasa' : 'No pasa'}</div>`)}
      <div class="cab"><div class="tit"><span>Pasaporte</span><span>Nº ${c.num}</span></div>
        <div class="nombre">${c.name}</div>
        <dl class="campos"><dt>Arma</dt><dd>${H.arma(c)}</dd><dt>Vida</dt><dd>${c.vida}</dd>${c.jefes == null ? '' : `<dt>Jefes del casino</dt><dd>${H.jefes(c)}</dd>`}</dl>
        ${H.req(c)}</div></div>
    <div class="pag der">${H.hab(c)}</div>
    ${H.est(c)}
  </div>`; }
};
</script>
<script src="seleccion.js"></script>
</body></html>
