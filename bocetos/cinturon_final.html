<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Expendedora y cinturón · Elegido por el dueño</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css">
<script src="fichas.js"></script><script src="sobres.js"></script><script src="vivo.js"></script><script src="apertura.js"></script>
<style>
/* Elegido por el dueño (19-oct-2026): a la izquierda (60 %) la expendedora del juego, a la derecha (40 %) el cinturón, como la tienda de Balatro */
.top h1{min-width:0;overflow:hidden;text-overflow:ellipsis}
.pill .bala{width:8px;height:18px;border-radius:4px 4px 1px 1px;background:linear-gradient(#e8c06a,#b8860b);box-shadow:none}
.lay{flex:1;min-height:0;display:grid;grid-template-columns:3fr 2fr;gap:var(--gap)}
/* ---------- Máquina (la «Expendedora Apocalipsis» del juego) ---------- */
.vm{min-width:0;min-height:0;display:grid;grid-template-columns:1fr minmax(96px,24%);grid-template-rows:auto 1fr auto;grid-template-areas:"let let" "vid pan" "ban ban";gap:6px;padding:8px;border-radius:14px;background:linear-gradient(90deg,#0b2e26,#0e3a30 18%,#0e3a30 82%,#0b2e26);border:3px solid #2a9a6a;box-shadow:inset 0 0 0 3px #062019,0 8px 22px #000a,0 0 18px #2a9a6a44}
.letrero{grid-area:let;height:30px;border-radius:6px;background:#08060a;border:2px solid #6ae08a;display:flex;align-items:center;justify-content:center;font:400 18px var(--display);color:#fff6e8;letter-spacing:3px;text-shadow:0 0 8px #6ae08a,0 0 16px #6ae08a}
.vidrio{grid-area:vid;min-height:0;position:relative;border-radius:8px;background:linear-gradient(#1a3036,#0d1b1f);box-shadow:inset 0 0 0 3px #c8ccd4,inset 0 0 22px #000c;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px 6px;padding:6px 8px 4px;overflow:hidden}
.vidrio::before{content:"";position:absolute;left:8px;right:8px;top:6px;height:3px;background:#eaffff;box-shadow:0 0 10px #eaffff;border-radius:2px;opacity:.8}
.vidrio::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,#fff0 34%,#ffffff14 40%,#fff0 47%);pointer-events:none}
.prod{position:relative;min-height:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer;border-radius:6px;padding-top:2px}
.prod .img{flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 0 2px}
.prod .img svg{height:100%;width:auto;max-width:100%;filter:drop-shadow(0 4px 4px #000a)}
.prod .img .f{height:100%;width:auto;aspect-ratio:1;max-height:var(--pf,60px)}
.prod .coil{width:86%;height:8px;flex:none;border-radius:3px;background:repeating-linear-gradient(90deg,#c8ccd4 0 3px,#0000 3px 9px),linear-gradient(#506068,#3a464c);box-shadow:0 2px 0 #222}
.prod .coil.gira{animation:coil .12s linear infinite}
@keyframes coil{to{background-position:9px 0,0 0}}
.prod .tag{position:absolute;right:2px;bottom:12px;z-index:2;font:700 14px/1 var(--hud);background:var(--bone);color:var(--ink);padding:2px 5px;border-radius:4px;white-space:nowrap;box-shadow:0 2px 4px #000a}
.prod.sel{background:#ffd27a22;box-shadow:inset 0 0 0 3px var(--gold)}
.prod.gone .img{opacity:.25}.prod.gone .tag{background:#555;color:#ddd}
.prod .num{position:absolute;left:3px;top:2px;font:700 14px/1 var(--hud);color:#7affc0;text-shadow:0 0 4px #000}
.panel2{grid-area:pan;min-height:0;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.pantalla{flex:1;min-height:0;border-radius:6px;background:#031a0e;border:2px solid #2a9a6a;color:#7affc0;padding:6px;font:600 14px/1.2 var(--hud);text-shadow:0 0 6px #7affc066;overflow:hidden;display:flex;flex-direction:column;gap:3px}
.pantalla b{font-size:16px;color:#c8ffe4}.pantalla .pr{color:var(--gold);font-size:16px}
.ranura{flex:none;height:30px;border-radius:5px;background:#d8a838;display:flex;align-items:center;justify-content:center;gap:6px;font:700 14px var(--hud);color:#2a1c04}
.ranura i{width:34px;height:6px;border-radius:2px;background:#050505}
.teclas{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.teclas i{height:10px;border-radius:2px;background:#d8e8e0;box-shadow:0 2px 0 #7a8a84}
.bajo{grid-area:ban;display:flex;gap:8px;align-items:stretch;min-height:0}
.bandeja{flex:1;min-width:0;min-height:52px;position:relative;border-radius:8px;background:#050607;box-shadow:inset 0 8px 14px #000,inset 0 0 0 2px #2a9a6a66;display:flex;align-items:center;justify-content:center;gap:6px;padding:2px 8px}
.bandeja .vac{font-size:14px;color:#7a8a84}
.bandeja .slot{width:calc(var(--bf) + 4px);height:calc(var(--bf) + 4px);border:0}
.bandeja .f{--ch:var(--bf)}
.bandeja .paq{height:46px;display:flex}.bandeja .paq svg{height:100%;width:auto}
.bajo .main{flex:none;min-width:150px}
/* ---------- Cinturón y reserva (como la tienda de Balatro: acomodas aquí mismo) ---------- */
.inv{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:14px;background:linear-gradient(#3a2412,#22140a);border:2px solid var(--brass-d);box-shadow:inset 0 0 0 2px #00000055}
.inv .lbl{display:flex;align-items:center;gap:6px}
.inv .lbl .sp{flex:1}
.inv .lbl small{font-size:14px;text-transform:none;letter-spacing:0}
.cnt{font:700 14px/1 var(--hud);padding:3px 7px;border-radius:8px;background:#0d3a1e;color:#8dffaa;border:1px solid #5bd17a;text-transform:none;letter-spacing:0}
.cnt.no{background:#0006;color:var(--bone-dim);border-color:#ffffff33}
.belt{display:grid;grid-template-columns:repeat(4,calc(var(--ch) + 4px));gap:6px 10px;justify-content:center;padding:6px 8px;border-radius:12px}
.reserva{display:grid;grid-template-columns:repeat(6,calc(var(--ch) + 4px));gap:6px;justify-content:center;padding:4px 6px;border-radius:12px;background:#0004;border:1px dashed #e0b07a55}
.inv .slot{width:calc(var(--ch) + 4px);height:calc(var(--ch) + 4px)}
.ficha-info{flex:1;min-height:46px;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:#0b1f15cc;border:1px solid #ffffff22;overflow:hidden}
.ficha-info .f{--ch:clamp(40px,8vh,64px)}
.ficha-info .t{min-width:0;display:flex;flex-direction:column;gap:2px}
.ficha-info h2{font:700 17px/1.1 var(--hud);color:var(--bone)}
.ficha-info .d{font-size:14px;color:var(--bone-dim);line-height:1.2}
.ficha-info .d b{color:#8dffaa}
.ficha-info .ladder{font-size:14px;margin-top:4px}
.acc{display:flex;gap:8px}
.acc .btn{flex:1;padding:0 8px}
#bJuntar:not([disabled]){border-color:#5bd17a;color:#d8ffe4;background:#0d3a1e;box-shadow:0 0 14px #5bd17a77;animation:par 1.3s ease-in-out infinite}
.solo-alta{display:none}
@media (min-height:560px) and (orientation:landscape){.solo-alta{display:block}.ficha-info{align-items:flex-start}}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px;gap:6px}.top h1{flex-basis:100%;order:-1;font-size:20px}.top .sp{display:none}.top .pill{padding:0 8px}.top .btn{padding:0 12px}
  .lay{grid-template-columns:1fr;grid-template-rows:1fr 1fr}
  .vm{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;grid-template-areas:"let" "vid" "pan" "ban";padding:6px}
  .panel2{flex-direction:row}.pantalla{flex:1;min-height:48px;max-height:64px}.teclas{display:none}.ranura{height:auto;width:56px;flex-direction:column;justify-content:center}
  .bajo .main{min-width:130px}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Expendedora y cinturón</h1><span class="sp"></span><span id="pills"></span><span class="pill" title="Balas normales en tu caja"><i class="bala"></i><b id="pNor">24</b></span><button class="btn" id="bReiniciar">Reiniciar</button></div>
<div class="lay">
 <div class="vm" id="vm">
  <div class="letrero">APOCALIPSIS</div>
  <div class="vidrio" id="vid"></div>
  <div class="panel2"><div class="pantalla" id="pan"></div><div class="teclas"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="ranura"><i></i></div></div>
  <div class="bajo"><div class="bandeja" id="ban"></div><button class="btn main" id="bComprar">Comprar</button></div>
 </div>
 <div class="inv" id="inv">
  <div class="lbl">Cinturón <b id="cCin"></b><span class="sp"></span><span class="cnt" id="cPar"></span></div>
  <div class="belt leather" id="cin"></div>
  <div class="lbl">Reserva <b id="cRes"></b><span class="sp"></span><small>no dan efecto</small></div>
  <div class="reserva" id="res"></div>
  <div class="ficha-info" id="info"></div>
  <div class="acc"><button class="btn" id="bVender" data-drop="vender" disabled>Vender</button><button class="btn" id="bJuntar" disabled>Juntar pareja</button></div>
 </div>
</div></div>
<script>
// Productos como en la máquina del juego: arriba los 3 sobres, en medio 3 balas sueltas, abajo cajas de balas normales
const SOB = [{ n: SOBRE_DE.Standard, k: 'Standard', p: 50, d: '3 balas, casi todas comunes' }, { n: SOBRE_DE.Terminator, k: 'Terminator', p: 100, d: '3 balas: más poco comunes y alguna rara' }, { n: SOBRE_DE.Especial, k: 'Especial', p: 300, d: '3 balas: muchas raras y a veces una legendaria' }];
const CAJ = [{ n: 12, p: 10 }, { n: 30, p: 22 }, { n: 60, p: 40 }];
const OFERTA0 = ['relampago', 'apuesta', 'hipnotica'];
let T, S = [];
function tienda() { T = { f: 0, c: 0, oferta: OFERTA0.map(id => ({ id, vendida: false })), nor: 24, ocupado: false }; Z.e.ban = []; }
tienda();
const precioB = id => PRECIO[rareza(id)];
function caja(n) { let b = ''; const rows = n > 30 ? 2 : 1; for (let r = 0; r < rows; r++) for (let i = 0; i < 5; i++) b += `<rect x="${38 + i * 26 + r * 13}" y="${44 - r * 16}" width="14" height="40" rx="7" fill="#d9a441" stroke="#7a5a18" stroke-width="2"/>`;
  return `<svg viewBox="0 0 200 170"><g>${b}</g><path d="M20 80 L180 80 L172 160 L28 160 Z" fill="#4f6b3a" stroke="#22301a" stroke-width="4"/><rect x="58" y="100" width="84" height="40" rx="4" fill="#f6ead7" stroke="#22301a" stroke-width="2"/><text x="100" y="130" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#22301a">${n}</text></svg>`; }
function prod(f, c) {
  if (f === 0) { const s = SOB[c]; return { t: 'sobre', s, nom: 'Sobre ' + s.k, p: s.p, img: sobreSVG(s.n) }; }
  if (f === 1) { const o = T.oferta[c]; return { t: 'bala', o, nom: nombre(o.id), p: precioB(o.id), img: ficha(o.id) }; }
  const k = CAJ[c]; return { t: 'caja', k, nom: k.n + ' normales', p: k.p, img: caja(k.n) };
}
// ---------- Dibujo ----------
function render() {
  $('#pills').innerHTML = pastillas();
  let g = '';
  for (let f = 0; f < 3; f++) for (let c = 0; c < 3; c++) {
    const P = prod(f, c), gone = P.t === 'bala' && P.o.vendida;
    g += `<div class="prod${f === T.f && c === T.c ? ' sel' : ''}${gone ? ' gone' : ''}" data-p="${f}${c}"><span class="num">${'ABC'[f]}${c + 1}</span><div class="img">${P.img}</div><div class="coil"></div><span class="tag">${gone ? 'Vendida' : P.p + ' $'}</span></div>`;
  }
  $('#vid').innerHTML = g;
  const P = prod(T.f, T.c), gone = P.t === 'bala' && P.o.vendida;
  let pan = `<span>${'ABC'[T.f]}${T.c + 1} · <span class="pr">${P.p} $</span></span><b>${P.nom}</b>`;
  if (P.t === 'sobre') pan += `<span>${P.s.d}</span>`;
  else if (P.t === 'caja') pan += `<span>Tu caja: ${T.nor}</span>`;
  else { const id = P.o.id, gem = Z.gemela(id, 1); pan += `<span style="color:${rcol(id)}">${RNOM[rareza(id)]}</span><span>${queHace(id, 1)}</span>${gem ? '<span style="color:#ffd27a">Tienes otra Nv 1: hará pareja</span>' : ''}`; }
  $('#pan').innerHTML = pan;
  const b = $('#bComprar'); b.textContent = gone ? 'Vendida' : 'Comprar · ' + P.p; b.disabled = gone || T.ocupado;
  // bandeja
  $('#ban').innerHTML = Z.e.ban.length ? Z.e.ban.map((x, i) => hueco('ban:' + i)).join('') : '<span class="vac">Bandeja</span>';
  // cinturón y reserva
  S = S.filter(l => Z.get(l));
  $('#cin').innerHTML = Z.e.cin.map((_, i) => hueco('cin:' + i)).join('');
  $('#res').innerHTML = Z.e.inv.map((_, i) => hueco('inv:' + i)).join('');
  $('#cCin').textContent = cuenta('cin'); $('#cRes').textContent = cuenta('inv');
  const ps = Z.parejas(); $('#cPar').textContent = ps.length ? `Parejas listas: ${ps.length}` : 'Sin parejas'; $('#cPar').className = 'cnt' + (ps.length ? '' : ' no');
  S.forEach(l => locEl(l)?.classList.add('elegida'));
  info(ps);
}
function info(ps) {
  const I = $('#info'), bJ = $('#bJuntar'), bV = $('#bVender');
  let h = '', jun = null;
  if (S.length === 2) {
    const r = Z.combinar(Z.get(S[0]), Z.get(S[1]));
    h = `${ficha(r.id, r.nv, { cls: 'glow', style: '--gc:' + brillo(r.id) })}<div class="t"><h2>${nombre(r.id)} · Nv ${r.nv - 1} + Nv ${r.nv - 1} = Nv ${r.nv}</h2><div class="d">${queHace(r.id, r.nv)}${r.nv === NIVEL_MAX && DATOS[r.id][5] ? ' <b>Despierta: ' + DATOS[r.id][5] + '</b>' : ''}</div></div>`;
    jun = [S[0], S[1]];
  } else if (S.length === 1) {
    const l = S[0], x = Z.get(l), comp = Z.companera(l);
    h = `${ficha(x.id, x.nv)}<div class="t"><h2 style="color:${brillo(x.id)}">${nombre(x.id)} · Nv ${x.nv}</h2><div class="d"><span style="color:${rcol(x.id)}">${RNOM[rareza(x.id)]}</span> · ${DATOS[x.id][3]}. ${queHace(x.id, x.nv)}${comp ? ' <b>Tiene pareja: toca Juntar.</b>' : x.nv >= NIVEL_MAX ? ' <b>Nivel máximo.</b>' : ''}${l.startsWith('inv') ? ' En la reserva no da efecto.' : ''}</div><div class="solo-alta">${escalera(x.id, x.nv)}</div></div>`;
    if (comp) jun = [comp, l];
  } else {
    h = `<div class="t"><h2>${ps.length ? 'Las que brillan en verde tienen pareja' : 'Toca una bala para verla'}</h2><div class="d">2 balas iguales del mismo nivel = 1 del nivel siguiente (hasta Nv 4). Arrastra para mover, cambiar o juntar.</div></div>`;
    if (ps.length) jun = [ps[0].a, ps[0].b];
  }
  I.innerHTML = h; bJ._par = jun; bJ.disabled = !jun || T.ocupado;
  bJ.textContent = jun ? (S.length ? 'Juntar' : 'Juntar pareja') + ` · Nv ${Z.get(jun[1]).nv + 1}` : 'Juntar pareja';
  const sel = S.length === 1 && Z.get(S[0]); bV.disabled = !sel || T.ocupado; bV.textContent = sel ? `Vender · +${venta(sel)}` : 'Vender';
}
// ---------- Acomodar (tocar y arrastrar) ----------
function tocar(k) {
  if (T.ocupado) return;
  if (!Z.get(k)) { if (S.length === 1 && !k.startsWith('ban')) { const a = S[0]; Z.mover(a, k); S = [k]; Son.clic(); render(); FX.rebote(fichaEl(k), 1.2); } return; }
  if (S.includes(k)) S = S.filter(x => x !== k);
  else if (S.length === 1 && !Z.combinar(Z.get(S[0]), Z.get(k)).err) S = [S[0], k];
  else S = [k];
  Son.ficha(); render(); FX.rebote(fichaEl(k), 1.15);
}
// a se va, b se queda: la ficha vuela girando hacia su gemela y se funden
async function juntarAnim(a, b) {
  if (T.ocupado) return; const A = Z.get(a), B = Z.get(b); if (Z.combinar(A, B).err) return;
  T.ocupado = true; S = [a, b]; render();
  const ea = fichaEl(a), eb = fichaEl(b); const desde = FX.centro(ea); ea.style.visibility = 'hidden';
  eb.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.18) rotate(-8deg)' }, { transform: 'scale(1.18) rotate(8deg)' }, { transform: 'scale(1.18)' }], { duration: 520 });
  Son.ficha();
  await FX.volar(desde, eb, ficha(A.id, A.nv), { color: brillo(A.id), giro: 540, ms: 560, arco: -70, escala: 1.4 });
  Son.clac(); Son.juntar(B.nv + 1);
  const r = Z.juntar(a, b); S = [b]; T.ocupado = false; render();
  const el = locEl(b); FX.estallido(fichaEl(b), '#ffffff', 10, r.item.nv >= 3);
  await celebrar(el, r);
}
async function venderAnim(l) {
  const x = Z.get(l); if (!x || T.ocupado) return; const antes = foto(), el = fichaEl(l), de = FX.centro(el);
  const p = Z.vender(l); S = []; render(); Son.moneda();
  FX.volar(de, $('#pOro'), ficha(x.id, x.nv), { color: '#ffd27a', w: 40 }).then(() => { contarPastillas(antes); FX.flotar($('#pOro'), '+' + p, '#ffd27a'); });
  FX.toast(`Vendiste ${nombre(x.id)} Nv ${x.nv} por ${p}`);
}
arrastre($('.lay'), {
  puede: () => !T.ocupado,
  alTocar(k) { if (k.startsWith('drop:')) return; tocar(k); },
  alPasar(a, b) {
    if (b === 'drop:vender') return 'Vender +' + venta(Z.get(a));
    if (b.startsWith('drop:') || b.startsWith('ban')) return '';
    const A = Z.get(a), B = Z.get(b); if (!B) return 'Mover';
    const r = Z.combinar(A, B); return r.err ? 'Cambiar' : 'Juntar · Nv ' + r.nv;
  },
  async alSoltar(a, b) {
    if (b === 'drop:vender') return venderAnim(a);
    if (b.startsWith('drop:') || b.startsWith('ban')) return;
    const A = Z.get(a), B = Z.get(b);
    if (B && !Z.combinar(A, B).err) return juntarAnim(a, b);
    if (B && a.startsWith('ban')) { FX.toast('Déjala en un espacio vacío o júntala con su gemela', true); return; }
    Z.mover(a, b); S = []; render(); FX.rebote(fichaEl(b), 1.2); Son.clic();
    if (A && a.startsWith('ban') && Z.pareja(b)) FX.flotar(fichaEl(b), '¡Pareja lista!', '#8dffaa');
  },
});
$('#bJuntar').onclick = () => { const p = $('#bJuntar')._par; if (p) juntarAnim(p[0], p[1]); };
$('#bVender').onclick = () => { if (S.length === 1) venderAnim(S[0]); };
// ---------- Comprar: la espiral gira, el producto cae a la bandeja ----------
$('#vid').onclick = e => { const p = e.target.closest('[data-p]'); if (!p || T.ocupado) return; T.f = +p.dataset.p[0]; T.c = +p.dataset.p[1]; Son.tic(1500, .06); render(); FX.rebote(p.querySelector('.img'), 1.1); };
function pagar(p) { if (Z.e.oro < p) { FX.toast('No te alcanza el oro', true); return false; } const a = Z.e.oro; Z.e.oro -= p; FX.contar($('#pOro'), a, Z.e.oro, 500, true); Son.moneda(); return true; }
async function caer(cell, html) {
  const img = cell.querySelector('.img'), coil = cell.querySelector('.coil'), [x1, y1, r1] = FX.centro(img), [x2, y2] = FX.centro($('#ban'));
  coil.classList.add('gira'); Son.motor(.9);
  const w = Math.min(r1.width, r1.height) * 1.05, d = document.createElement('div'); d.className = 'vuela'; d.innerHTML = html;
  d.style.cssText = `left:${x1 - w / 2}px;top:${y1 - w / 2}px;width:${w}px;height:${w}px;display:flex;align-items:center;justify-content:center`; FX.capa().appendChild(d);
  img.style.visibility = 'hidden';
  // la espiral la empuja hacia adelante y cae por gravedad
  await d.animate([{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(2px) scale(1.18)' }], { duration: 900, easing: 'ease-in-out', fill: 'forwards' }).finished;
  coil.classList.remove('gira');
  await d.animate([{ transform: 'translateY(2px) scale(1.18)' }, { transform: `translate(${(x2 - x1) * .3}px,${y2 - y1}px) scale(1) rotate(24deg)` }], { duration: 520, easing: 'cubic-bezier(.55,0,1,.45)', fill: 'forwards' }).finished;
  Son.caida(); FX.sacudir($('#vm')); FX.estallidoXY(x1 + (x2 - x1) * .3, y2, '#cfe8e0', 8);
  await d.animate([{ transform: `translate(${(x2 - x1) * .3}px,${y2 - y1}px) rotate(24deg)` }, { transform: `translate(${(x2 - x1) * .3}px,${y2 - y1 - 14}px) rotate(10deg)` }, { transform: `translate(${(x2 - x1) * .3}px,${y2 - y1}px) rotate(18deg)` }], { duration: 280, easing: 'ease-out', fill: 'forwards' }).finished;
  return d;
}
// Las balas de la bandeja vuelan al primer lugar libre (cinturón y después reserva)
async function guardarBandeja() {
  while (Z.e.ban.length) {
    const dest = Z.libre('cin') || Z.libre('inv');
    if (!dest) { FX.toast('Sin lugar: arrastra la bala de la bandeja a su gemela o vende otra', true); break; }
    const de = FX.centro(fichaEl('ban:0')), it = Z.e.ban.shift(); Z.set(dest, it); render();
    const el = fichaEl(dest); el.style.visibility = 'hidden';
    await FX.volar(de, el, ficha(it.id, it.nv), { color: brillo(it.id), arco: -90, ms: 560 });
    el.style.visibility = ''; Son.clac(); FX.rebote(el, 1.3); FX.estallido(el, brillo(it.id), 10, rareza(it.id) === 'S');
    FX.flotar(el, Z.pareja(dest) ? '¡Pareja lista!' : nombre(it.id), Z.pareja(dest) ? '#8dffaa' : brillo(it.id));
    await espera(160);
  }
  render();
}
$('#bComprar').onclick = async () => {
  if (T.ocupado) return; const P = prod(T.f, T.c), cell = $(`#vid [data-p="${T.f}${T.c}"]`);
  if (P.t === 'bala' && P.o.vendida) return;
  if (!pagar(P.p)) return;
  T.ocupado = true; S = []; render();
  const d = await caer($(`#vid [data-p="${T.f}${T.c}"]`), P.t === 'bala' ? ficha(P.o.id) : P.img);
  if (P.t === 'caja') {
    await FX.volar(FX.centro(d), $('#pNor').parentNode, P.img, { w: 44, arco: -60, estela: false }); d.remove();
    const a = T.nor; T.nor += P.k.n; FX.flotar($('#pNor'), '+' + P.k.n + ' balas', '#ffd27a'); await FX.contar($('#pNor'), a, T.nor, 600, true);
    T.ocupado = false; render(); return;
  }
  if (P.t === 'bala') {
    P.o.vendida = true; d.remove(); Z.e.ban.push(nueva(P.o.id, 1)); render(); FX.rebote(fichaEl('ban:0'), 1.3);
    await espera(250); await guardarBandeja(); T.ocupado = false; render(); return;
  }
  // sobre: cae, y se abre con la Tragamonedas
  await espera(350); d.remove();
  abrirVentanaSobre({ anim: 5, sobre: P.s.n, titulo: 'Sobre ' + P.s.k, unaVez: true, alCerrar: async lista => {
    lista.forEach(id => Z.e.ban.push(nueva(id, 1))); render();
    await espera(200); await guardarBandeja(); T.ocupado = false; render();
  } });
};
botonReiniciar(() => { tienda(); S = []; $('#pNor').textContent = T.nor; render(); });
// Tamaño de las fichas: el más grande que quepa sin desplazar la pantalla
function ajustar() {
  const inv = $('#inv'); let ch = 76;
  for (; ch > 30; ch -= 2) { inv.style.setProperty('--ch', ch + 'px'); if (inv.scrollHeight <= inv.clientHeight + 1 && inv.scrollWidth <= inv.clientWidth + 1) break; }
  const vm = $('#vm'); vm.style.setProperty('--bf', Math.max(32, Math.min(46, $('#ban').clientHeight - 8)) + 'px');
  const r = $('#vid .prod .img'); if (r) $('#vid').style.setProperty('--pf', Math.max(28, Math.min(96, r.clientHeight * .85)) + 'px');
}
render(); ajustar(); addEventListener('resize', () => { ajustar(); });
