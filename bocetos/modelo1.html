<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 1 · Mesa de póker</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css"><script src="fichas.js"></script><script src="vivo.js"></script>
<style>
.lay{flex:1;display:grid;grid-template-columns:1.45fr 1fr;gap:var(--gap);min-height:0}
.left{display:flex;flex-direction:column;gap:var(--gap);min-height:0}.left>*{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}
.row{gap:4px;padding:6px 10px}
.chips{display:flex;gap:clamp(3px,.6vw,10px);align-items:center}
.belt{border-radius:12px;padding:6px 10px 8px}
.pila{display:flex;align-items:center;min-width:calc(var(--ch) + 8px);min-height:calc(var(--ch) + 8px);border-radius:12px}
.pila .f{margin-right:calc(var(--ch) * -0.6)}.pila .f:last-child{margin-right:0}
.pila.vacio .slot{border-color:#e0b07a88}
.bote{position:relative;border-radius:50%/42%;background:radial-gradient(#2b7a52,#174a31);border:6px solid var(--wood);box-shadow:inset 0 0 0 2px var(--brass-d),inset 0 0 30px #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 18px;min-height:0}
.pot{position:relative;width:calc(var(--ch)*2.6);height:calc(var(--ch)*1.4);display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px dashed #ffd27a55}
.pot .spot{position:absolute;top:calc(var(--ch)*.2);width:var(--ch);height:var(--ch);border-radius:50%;border:2px dashed #ffffff33}
.pot .spot.a{left:calc(var(--ch)*.15)}.pot .spot.b{right:calc(var(--ch)*.15)}
.pot .spot.a .f{transform:rotate(-14deg)}.pot .spot.b .f{transform:rotate(14deg)}
.pot .res{position:absolute;left:50%;top:calc(var(--ch)*.1);margin-left:calc(var(--ch)*-.55);width:calc(var(--ch)*1.1);height:calc(var(--ch)*1.1);z-index:2;display:flex;align-items:center;justify-content:center}
.pot .res .f{width:100%;height:100%}
.pot .res.prev{opacity:.5}
.pot .q{width:calc(var(--ch)*.8);height:calc(var(--ch)*.8);border-radius:50%;border:2px dashed #b67cff;background:#0008;display:flex;align-items:center;justify-content:center;font:400 26px var(--display);color:#b67cff}
.pot .rays{display:none}.pot.brilla .rays{display:block}
.eq{font-size:18px;text-align:center}.eq b{color:#6fd3f0}.eq .no{color:#ff8a7a}
.hint{font-size:14px;color:var(--bone-dim);text-align:center}
.bote .btn.main{width:100%;max-width:300px}
.slot{cursor:pointer}
@media (orientation:portrait){
  :root{--ch:clamp(44px,13vw,64px)}
  .top{flex-wrap:wrap;row-gap:6px}.top h1{flex-basis:100%;order:-1}
  .lay{grid-template-columns:1fr;grid-template-rows:auto auto auto 1fr}
  .left{display:contents}
  .chips{flex-wrap:wrap;justify-content:center}
  .belt .chips{display:grid;grid-template-columns:repeat(4,auto);justify-content:center;gap:6px 10px}
  .bote{border-radius:30px}
  .ladder.pc-only{display:grid!important;font-size:16px}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Mesa de póker</h1><span class="sp"></span><span id="pills"></span><button class="btn" id="bReiniciar">Reiniciar</button></div>
<div class="lay">
 <div class="left">
  <div class="belt leather"><div class="lbl">Cinturón <b id="cCin"></b> · dan efecto</div><div class="chips" id="cin"></div></div>
  <div class="row panel"><div class="lbl">Reserva <b id="cInv"></b> · guardadas, no dan efecto</div><div class="chips" id="inv"></div></div>
 </div>
 <div class="bote">
  <div class="hint" id="hint">Pon en el bote 2 balas iguales del mismo nivel</div>
  <div class="pot" id="pot" data-drop="bote"></div>
  <div class="eq" id="eq">&nbsp;</div>
  <div class="hint" id="desc">&nbsp;</div>
  <div class="pc-only" id="lad"></div>
  <button class="btn main" id="bJuntar">Juntar la pareja</button>
 </div>
</div></div>
<script>
let bote = [], mostrar = null;
const mesa = document.querySelector('.frame');
function orden() { // [la que se va, la que se queda]
  const [a, b] = bote;
  if (a.startsWith('cin') && !b.startsWith('cin')) return [b, a]; return [a, b];
}
function render() {
  bote = bote.filter(l => Z.get(l));
  $('#pills').innerHTML = pastillas();
  $('#cin').innerHTML = Z.e.cin.map((_, i) => hueco('cin:' + i, 'slot' + (i % 2 ? '' : ' sq'))).join('');
  $('#inv').innerHTML = Z.e.inv.map((_, i) => hueco('inv:' + i)).join('');
  $('#cCin').textContent = cuenta('cin'); $('#cInv').textContent = cuenta('inv');
  bote.forEach(l => locEl(l)?.classList.add('usada', 'elegida'));
  const pot = $('#pot'); let h = '<div class="rays"></div>';
  h += `<span class="spot a">${bote[0] ? ficha(Z.get(bote[0]).id, Z.get(bote[0]).nv) : ''}</span><span class="spot b">${bote[1] ? ficha(Z.get(bote[1]).id, Z.get(bote[1]).nv) : ''}</span>`;
  let eq = '&nbsp;', desc = '&nbsp;', lad = '', ok = false;
  if (mostrar) { h += `<span class="res">${ficha(mostrar.id, mostrar.nv)}</span>`; eq = `<b>${nombre(mostrar.id)} · Nv ${mostrar.nv}</b>`; desc = queHace(mostrar.id, mostrar.nv); lad = escalera(mostrar.id, mostrar.nv); }
  else if (bote.length === 2) {
    const [s, d] = orden(), A = Z.get(s), B = Z.get(d), r = Z.combinar(A, B);
    if (r.err) eq = `<span class="no">${r.err}</span>`;
    else { ok = true; h += `<span class="res prev">${ficha(r.id, r.nv)}</span>`; eq = `${nombre(r.id)} <b>Nv ${B.nv} + Nv ${A.nv} = Nv ${r.nv}</b>`; desc = queHace(r.id, r.nv); lad = escalera(r.id, r.nv); }
  } else if (bote.length === 1) { const A = Z.get(bote[0]); eq = `${nombre(A.id)} <b>Nv ${A.nv}</b>`; desc = A.nv >= NIVEL_MAX ? 'Ya está en Nv 4, el máximo' : `Falta su gemela: otra ${nombre(A.id)} Nv ${A.nv}`; lad = escalera(A.id, A.nv); }
  else { const n = Z.parejas().length; desc = n ? `Tienes ${n} ${n > 1 ? 'parejas listas' : 'pareja lista'}: brillan en verde` : 'No tienes parejas listas'; }
  pot.innerHTML = h; if (!mostrar) pot.classList.remove('brilla'); $('#eq').innerHTML = eq; $('#desc').innerHTML = desc; $('#lad').innerHTML = lad;
  $('#bJuntar').disabled = !ok || mostrar;
}
function alBote(l) { if (bote.includes(l)) { bote = bote.filter(x => x !== l); Son.clic(); } else { if (bote.length === 2) bote.shift(); bote.push(l); Son.ficha(); } render(); FX.rebote($('#pot .spot.' + (bote.indexOf(l) ? 'b' : 'a') + ' .f'), 1.25); }
arrastre(mesa, {
  alTocar(k, el, t) {
    if (k === 'drop:bote') { const sp = t.closest('.spot'); if (sp) { const i = sp.classList.contains('a') ? 0 : 1; if (bote[i]) { bote.splice(i, 1); Son.clic(); render(); } } return; }
    if (Z.get(k)) alBote(k);
  },
  alPasar(a, b) { if (b === 'drop:bote') return 'Al bote'; return Z.get(b) ? 'Cambiar' : 'Mover'; },
  alSoltar(a, b) {
    if (b === 'drop:bote') { if (!bote.includes(a)) alBote(a); return; }
    const r = Z.mover(a, b); if (r.err) { if (r.err) FX.toast(r.err, true); return; }
    bote = bote.map(x => x === a ? b : x === b ? a : x); render();
    FX.rebote(fichaEl(b), 1.2); Son.clic();
  },
});
$('#bJuntar').onclick = async () => {
  if (bote.length < 2) return; const [s, d] = orden(); const antes = foto();
  const ss = $$('#pot .spot .f'); $('#pot').classList.add('brilla');
  ss.forEach((f, i) => f.animate([{ transform: `rotate(${i ? 14 : -14}deg)` }, { transform: `rotate(${i ? 360 : -360}deg) scale(1.1)` }, { transform: `translateX(${(i ? -1 : 1) * 0.55 * f.offsetWidth}px) rotate(${i ? 720 : -720}deg) scale(.9)` }], { duration: 750, easing: 'ease-in', fill: 'forwards' }));
  Son.ficha(); Son.ficha(.25); Son.ficha(.5); Son.juntar(Z.get(d).nv + 1); $('#bJuntar').disabled = true;
  await espera(760);
  const r = Z.juntar(s, d); if (r.err) { $('#pot').classList.remove('brilla'); FX.toast(r.err, true); render(); return; }
  bote = []; mostrar = r.item; render(); $('#pot').classList.add('brilla'); contarPastillas(antes);
  await celebrar($('#pot .res'), r);
  await espera(1100);
  const de = $('#pot .res .f'); mostrar = null;
  await FX.volar(de, fichaEl(d), ficha(r.item.id, r.item.nv), { color: brillo(r.item.id) });
  render(); const el = fichaEl(d); Son.ficha(); FX.rebote(el, 1.3); FX.estallido(el, brillo(r.item.id), 10);
};
botonReiniciar(() => { bote = []; mostrar = null; render(); });
render();
</script></body></html>
