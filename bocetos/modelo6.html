<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 6 · Expendedora con taller</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css">
<script src="fichas.js"></script><script src="sobres.js"></script><script src="vivo.js"></script><script src="apertura.js"></script>
<style>
.lay{flex:1;min-height:0;display:flex;gap:calc(var(--gap)*1.5)}
.vm{flex:1.1;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:linear-gradient(#8e1f16,#4f0e09);border:3px solid var(--brass);box-shadow:inset 0 0 0 4px #2a0805,0 8px 22px #000a;min-width:0;min-height:0}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-height:48px;border-radius:10px;border:2px solid #ffffff33;background:#0005;color:var(--bone);font:600 16px var(--hud);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;cursor:pointer;padding:0 6px}
.tab.on{background:var(--bone);color:var(--ink);border-color:var(--gold)}
.glass{flex:1;min-height:0;position:relative;border-radius:10px;background:linear-gradient(115deg,#1d3a4a 0%,#0e1c26 60%,#16303e 100%);box-shadow:inset 0 0 0 3px #111,inset 0 0 26px #000c;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:4px;padding:6px 8px;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#ffffff00 30%,#ffffff1c 38%,#ffffff00 46%);pointer-events:none}
.prod{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;border-bottom:3px solid #6b7680;cursor:pointer;min-height:0;border-radius:8px 8px 0 0}
.prod .coil{position:absolute;bottom:0;left:10%;right:10%;height:10px;background:repeating-linear-gradient(90deg,#9aa3ab 0 3px,transparent 3px 9px);opacity:.7}
.prod .tag{position:relative;z-index:1;font:700 14px/1 var(--hud);background:var(--bone);color:var(--ink);padding:3px 6px;border-radius:4px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.prod.sel{outline:3px solid var(--gold);outline-offset:-2px;background:#ffd27a1a}
.prod.gone{opacity:.4}.prod.gone .tag{background:#555;color:#ddd}
.prod .img{flex:0 1 auto;min-height:0;height:calc(var(--ch)*1.15);display:flex;align-items:flex-end;justify-content:center}
.prod .img svg{height:100%;width:auto}
.glass .f{--ch:clamp(40px,10vh,84px)}
.note{font-size:14px;color:var(--gold);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;min-height:20px}
.note .btn{min-height:48px;font-size:14px;padding:0 10px}
.tray{height:calc(var(--ch)*.9);flex:none;border-radius:10px;background:#0a0a0a;box-shadow:inset 0 6px 12px #000;position:relative;display:flex;align-items:center;justify-content:center;font-size:14px;color:#777}
.tray .f{transform:rotate(12deg)}
.side{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.bgrid{display:flex;gap:10px;align-items:center}
.g4{display:grid;grid-template-columns:repeat(4,calc(var(--ch) + 4px));gap:5px 8px}
.g4 .slot,.inv .slot{width:calc(var(--ch) + 4px);height:calc(var(--ch) + 4px)}
.pila{display:flex;flex-direction:column;align-items:center;min-width:var(--ch);min-height:var(--ch);border-radius:12px}.pila .f{margin-bottom:calc(var(--ch)*-.75)}.pila .f:last-child{margin-bottom:0}
.inv{display:flex;gap:6px}
.match{display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 10px;border-radius:12px;background:#0d2a3a;border:2px solid #6fd3f0;box-shadow:0 0 16px #6fd3f066;font-size:16px}
.match .f{--ch:clamp(32px,7vh,48px)}
.match.off{border-color:#ffffff33;box-shadow:none;background:#0b1f15cc}
.pill .bala{width:8px;height:18px;border-radius:4px 4px 1px 1px;background:linear-gradient(#e8c06a,#b8860b);box-shadow:none}
.acc{display:flex;gap:8px;margin-top:auto}.acc .main{flex:1}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px;gap:6px}.top h1{flex-basis:100%;order:-1}.top .lbl{display:none}.top .sp{display:none}.top .pill{padding:0 8px}.top .btn{padding:0 12px}
  :root{--ch:clamp(40px,10.5vw,56px)}
  .lay{flex-direction:column}
  .vm{flex:1.1}.side{flex:1}
  .glass .f{--ch:clamp(40px,8vh,70px)}
  .side .pc-only{display:none!important}
  .match{font-size:14px}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Expendedora</h1><span class="lbl">Compra y acomoda aquí mismo</span><span class="sp"></span><span class="pill"><i></i><b id="pOro">600</b></span><span class="pill" title="Balas normales"><i class="bala"></i><b id="pNor">0</b></span><button class="btn" id="bReiniciar">Reiniciar</button></div>
<div class="lay">
 <div class="vm">
  <div class="tabs" id="tabs"><span class="tab" data-t="sobres">Sobres</span><span class="tab" data-t="cajas">Cajas</span><span class="tab" data-t="oferta">Oferta de hoy</span></div>
  <div class="glass" id="glass"></div>
  <div class="note" id="note"></div>
  <div class="tray" id="tray">Bandeja</div>
 </div>
 <div class="side" id="side">
  <div class="lbl">Cinturón <b id="cCin"></b></div>
  <div class="bgrid"><div class="g4" id="cin"></div></div>
  <div class="lbl">Reserva <b id="cInv"></b></div>
  <div class="inv" id="inv"></div>
  <div class="match" id="match"></div>
  <div class="panel pc-only"><div class="lbl" style="margin-bottom:6px">Al comprar</div><div class="txt">La bala cae en la bandeja. Si tienes su gemela de Nv 1, se junta sola y sube a Nv 2. Si no, va al primer lugar libre.<br><small>Arrastra tus balas para acomodarlas. Toca una para venderla.</small></div></div>
  <div class="acc"><button class="btn" id="bVender" disabled>Vender</button><button class="btn main" id="bComprar">Comprar</button></div>
 </div>
</div></div>
<script>
const SOBRES_T = [{ n: SOBRE_DE.Standard, nom: 'Standard', p: 50 }, { n: SOBRE_DE.Terminator, nom: 'Terminator', p: 100 }, { n: SOBRE_DE.Especial, nom: 'Especial', p: 300 }];
const CAJAS = [{ n: 25, p: 15 }, { n: 50, p: 25 }];
const OFERTA0 = ['escarcha', 'relampago', 'oro', 'espejo', 'apuesta', 'hipnotica'];
let T; function tiendaNueva() { T = { tab: 'oferta', sel: 0, oferta: OFERTA0.map(id => ({ id, vendida: false })), nor: 0, mia: null, ocupado: false }; }
tiendaNueva();
const precio = id => PRECIO[rareza(id)];
function caja(n) { let b = ''; const rows = n > 30 ? 2 : 1; for (let r = 0; r < rows; r++) for (let i = 0; i < 5; i++) b += `<rect x="${38 + i * 26 + r * 13}" y="${44 - r * 16}" width="14" height="40" rx="7" fill="#d9a441" stroke="#7a5a18" stroke-width="2"/>`;
  return `<svg viewBox="0 0 200 170"><g>${b}</g><path d="M20 80 L180 80 L172 160 L28 160 Z" fill="#4f6b3a" stroke="#22301a" stroke-width="4"/><rect x="58" y="100" width="84" height="40" rx="4" fill="#f6ead7" stroke="#22301a" stroke-width="2"/><text x="100" y="130" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#22301a">${n}</text></svg>`; }
function render() {
  if (T.mia && !Z.get(T.mia)) T.mia = null;
  $$('#tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.t === T.tab));
  let g = '';
  if (T.tab === 'oferta') g = T.oferta.map((o, i) => `<div class="prod${i === T.sel ? ' sel' : ''}${o.vendida ? ' gone' : ''}" data-p="${i}">${ficha(o.id, 1)}<span class="tag">${nombre(o.id)} · ${o.vendida ? 'Vendida' : precio(o.id)}</span><div class="coil"></div></div>`).join('');
  if (T.tab === 'sobres') g = SOBRES_T.map((s, i) => `<div class="prod${i === T.sel ? ' sel' : ''}" data-p="${i}"><div class="img">${sobreSVG(s.n)}</div><span class="tag">${s.nom} · ${s.p}</span><div class="coil"></div></div>`).join('');
  if (T.tab === 'cajas') g = CAJAS.map((c, i) => `<div class="prod${i === T.sel ? ' sel' : ''}" data-p="${i}"><div class="img">${caja(c.n)}</div><span class="tag">Caja de ${c.n} · ${c.p}</span><div class="coil"></div></div>`).join('');
  $('#glass').innerHTML = g; $('#glass').style.gridTemplateRows = T.tab === 'oferta' ? 'repeat(2,1fr)' : '1fr';
  $('#note').innerHTML = T.tab === 'oferta' ? '1 bala por compra · la oferta cambia cada visita' : T.tab === 'sobres' ? '3 balas al azar · se abren con la Tragamonedas' : 'Balas normales para tu arma';
  $('#cin').innerHTML = Z.e.cin.map((_, i) => hueco('cin:' + i)).join('');
  $('#inv').innerHTML = Z.e.inv.map((_, i) => hueco('inv:' + i)).join('');
  $('#cCin').textContent = cuenta('cin'); $('#cInv').textContent = cuenta('inv');
  if (T.mia) locEl(T.mia)?.classList.add('elegida');
  // vista previa y botón
  const b = $('#bComprar'), m = $('#match'); let txt = '', dis = T.ocupado;
  if (T.tab === 'oferta') {
    const o = T.oferta[T.sel], gem = Z.gemela(o.id, 1);
    if (o.vendida) { txt = 'Vendida'; dis = true; m.className = 'match off'; m.innerHTML = 'Ya compraste esta bala. Elige otra.'; }
    else if (gem) { const G = Z.get(gem), r = Z.combinar(nueva(o.id, 1), G); txt = 'Comprar y juntar · ' + precio(o.id); m.className = 'match'; m.innerHTML = `${ficha(o.id, 1)}<span>+</span>${ficha(G.id, G.nv)}<span>= <b style="color:${brillo(r.id)}">${nombre(r.id)} Nv ${r.nv}</b> ${gem.startsWith('cin') ? 'en tu cinturón' : 'en tu inventario'}</span>`; }
    else { txt = 'Comprar · ' + precio(o.id); m.className = 'match off'; m.innerHTML = `${ficha(o.id, 1)}<span>${nombre(o.id)}: ${queHace(o.id, 1)}. Va al primer lugar libre.</span>`; }
  } else if (T.tab === 'sobres') { const s = SOBRES_T[T.sel]; txt = 'Comprar sobre · ' + s.p; m.className = 'match off'; m.innerHTML = `<span>Sobre ${s.nom}: 3 balas. Las gemelas de Nv 1 se juntan solas.</span>`; }
  else { const c = CAJAS[T.sel]; txt = 'Comprar caja · ' + c.p; m.className = 'match off'; m.innerHTML = `<span>${c.n} balas normales para tu arma. Tienes ${T.nor}.</span>`; }
  b.textContent = txt; b.disabled = dis;
  const v = $('#bVender'); const mi = T.mia && Z.get(T.mia); v.disabled = !mi || T.ocupado; v.textContent = mi ? `Vender · +${venta(mi)}` : 'Vender';
}
function pagar(p) { if (Z.e.oro < p) { FX.toast('No te alcanza el oro', true); return false; } const a = Z.e.oro; Z.e.oro -= p; FX.contar($('#pOro'), a, Z.e.oro, 500, true); Son.moneda(); return true; }
// Una bala nueva cae en la bandeja y va a su gemela o a un lugar libre
async function entrar(id, desde) {
  const tray = $('#tray');
  if (desde) { Son.resorte(); await FX.volar(desde, tray, ficha(id, 1), { arco: 0, ms: 420, ease: 'cubic-bezier(.5,0,1,1)', color: brillo(id) }); }
  Son.metal(); tray.innerHTML = ficha(id, 1, { cls: 'glow', style: '--gc:' + brillo(id) }); FX.rebote(tray.firstChild, 1.25); FX.estallido(tray.firstChild, brillo(id), 8);
  await espera(450);
  const gem = Z.gemela(id, 1); const dest = gem || Z.libre('cin') || Z.libre('inv');
  const de = tray.firstChild;
  if (!dest) { const p = Math.round(precio(id) / 2), a = Z.e.oro; Z.e.oro += p; FX.contar($('#pOro'), a, Z.e.oro); tray.innerHTML = 'Bandeja'; FX.toast(`Sin lugar: ${nombre(id)} se vendió por ${p}`); return; }
  await FX.volar(de, fichaEl(dest) || locEl(dest), ficha(id, 1), { color: brillo(id) }); tray.innerHTML = 'Bandeja';
  if (gem) {
    const G = Z.get(gem), r = Z.combinar(nueva(id, 1), G), it = nueva(r.id, r.nv); Z.set(gem, it);
    render(); Son.juntar(r.nv);
    await celebrar(fichaEl(gem), { ...r, item: it, antes: G.nv });
  } else { Z.set(dest, nueva(id, 1)); render(); const el = fichaEl(dest); Son.clac(); FX.rebote(el, 1.3); FX.estallido(el, brillo(id), 8); FX.flotar(el, nombre(id), brillo(id)); }
}
async function comprar() {
  if (T.ocupado) return;
  if (T.tab === 'oferta') {
    const o = T.oferta[T.sel]; if (o.vendida) return;
    if (!Z.gemela(o.id, 1) && !Z.libre('cin') && !Z.libre('inv')) { FX.toast('No hay lugar: vende una bala primero', true); return; }
    if (!pagar(precio(o.id))) return;
    T.ocupado = true; render();
    const pr = $(`#glass [data-p="${T.sel}"]`); pr.querySelector('.coil').animate([{ transform: 'scaleX(1)' }, { transform: 'scaleX(1.25)' }, { transform: 'scaleX(1)' }], { duration: 400, iterations: 2 });
    const f = pr.querySelector('.f'); o.vendida = true; f.style.visibility = 'hidden';
    await entrar(o.id, f); T.ocupado = false; render(); return;
  }
  if (T.tab === 'cajas') {
    const c = CAJAS[T.sel]; if (!pagar(c.p)) return; T.ocupado = true; render();
    const pr = $(`#glass [data-p="${T.sel}"] .img`); Son.resorte();
    await FX.volar(pr, $('#tray'), caja(c.n), { arco: 0, ms: 420, ease: 'cubic-bezier(.5,0,1,1)', w: 60, estela: false }); Son.metal();
    const a = T.nor; T.nor += c.n; await FX.contar($('#pNor'), a, T.nor, 600, true); FX.flotar($('#pNor'), '+' + c.n + ' balas', '#ffd27a');
    T.ocupado = false; render(); return;
  }
  const s = SOBRES_T[T.sel]; if (!pagar(s.p)) return; T.ocupado = true; render();
  abrirVentanaSobre({ anim: 5, sobre: s.n, titulo: 'Sobre ' + s.nom, alOtro: () => pagar(s.p), alCerrar: async lista => { for (const id of lista) await entrar(id, null); T.ocupado = false; render(); } });
}
$('#bComprar').onclick = comprar;
$('#tabs').onclick = e => { const t = e.target.closest('[data-t]'); if (!t || T.ocupado) return; T.tab = t.dataset.t; T.sel = T.tab === 'oferta' ? Math.max(0, T.oferta.findIndex(o => !o.vendida)) : T.tab === 'sobres' ? 1 : 0; Son.clic(); render(); };
$('#glass').onclick = e => { const p = e.target.closest('[data-p]'); if (!p || T.ocupado) return; T.sel = +p.dataset.p; Son.clic(); render(); FX.rebote(p.querySelector('.f,.img'), 1.1); };
$('#bVender').onclick = () => { const l = T.mia, it = l && Z.get(l); if (!it) return; const p = venta(it), a = Z.e.oro; Z.e.oro += p; FX.estallido(fichaEl(l), '#ffd27a', 12); Z.set(l, null); T.mia = null; Son.moneda(); render(); FX.contar($('#pOro'), a, Z.e.oro); FX.toast(`Vendiste ${nombre(it.id)} por ${p}`); };
arrastre($('#side'), {
  puede: () => !T.ocupado,
  alTocar(k) { if (!Z.get(k)) return; T.mia = T.mia === k ? null : k; Son.clic(); render(); },
  alPasar(a, b) { const B = Z.get(b); if (!B) return 'Mover'; const r = Z.combinar(Z.get(a), B); return r.err ? 'Cambiar' : 'Juntar · Nv ' + r.nv; },
  async alSoltar(a, b) {
    const B = Z.get(b);
    if (B && !Z.combinar(Z.get(a), B).err) { const r = Z.juntar(a, b); if (r.err) { FX.toast(r.err, true); return; } T.mia = null; render(); Son.juntar(r.nv); return celebrar(fichaEl(b), r); }
    const r = Z.mover(a, b); if (r.err) { if (r.err) FX.toast(r.err, true); return; } T.mia = null; render(); FX.rebote(fichaEl(b), 1.2); Son.clic();
  },
});
botonReiniciar(() => { tiendaNueva(); $('#pOro').textContent = Z.e.oro; $('#pNor').textContent = 0; render(); });
render();
</script></body></html>
