<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario 1 · Canana de pistolero</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css"><link rel="stylesheet" href="inventario.css">
<script src="fichas.js"></script><script src="vivo.js"></script><script src="inventario.js"></script>
<style>
/* Diseño 1: la canana (cinturón de balas del pistolero) cruza toda la pantalla, con sus 8 presillas de cuero.
   Debajo, la alforja con la reserva y una nota de papel con la bala elegida. El perfil es la otra pestaña. */
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;min-height:48px;border-radius:10px;border:2px solid #ffffff33;background:#0005;color:var(--bone);font:600 16px var(--hud);cursor:pointer;max-width:260px}
.tab.on{background:var(--bone);color:var(--ink);border-color:var(--gold)}
.tabs .sp{flex:1}
.tabs .cnt{align-self:center;font:700 14px/1 var(--hud);padding:6px 9px;border-radius:8px;background:#0d3a1e;color:#8dffaa;border:1px solid #5bd17a;white-space:nowrap}
.tabs .cnt.no{background:#0006;color:var(--bone-dim);border-color:#ffffff33}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--gap)}
/* ---------- La canana ---------- */
.canana-zona{flex:none;position:relative;display:flex;flex-direction:column;gap:2px;padding:0 4px}
.canana-zona .lbl{padding-left:6px}
.correa{--ch:var(--cc);position:relative;display:flex;justify-content:space-evenly;align-items:center;padding:8px 52px 8px 62px;border-radius:14px;transform:rotate(-1.6deg);
  background:repeating-linear-gradient(90deg,#00000014 0 2px,transparent 2px 11px),linear-gradient(#8a5428,#6b3f1d 45%,#4a2a12);
  border-top:3px dashed #e0b07a99;border-bottom:3px dashed #e0b07a99;box-shadow:0 10px 18px #000a,inset 0 2px 0 #ffffff22,inset 0 -3px 0 #00000055}
.correa+.correa{transform:rotate(1.6deg);margin-top:6px}
/* hebilla de latón y punta de la correa */
.correa::before{content:"";position:absolute;left:10px;top:50%;width:40px;height:calc(100% + 10px);transform:translateY(-50%);border-radius:8px;border:6px solid #eaa23a;box-shadow:0 0 0 2px #8a5a18,inset 0 0 0 2px #8a5a18,0 4px 8px #000a}
.correa::after{content:"";position:absolute;right:-2px;top:50%;width:46px;height:70%;transform:translateY(-50%);border-radius:0 40px 40px 0;background:linear-gradient(#7a4822,#4a2a12);border:2px dashed #e0b07a66}
.correa .slot{position:relative;width:calc(var(--ch) + 12px);height:calc(var(--ch) + 18px);border:0;border-radius:12px 12px 16px 16px;
  background:linear-gradient(#5a3418,#3a200c);box-shadow:inset 0 0 0 2px #00000066,inset 0 -6px 0 #00000044,0 0 0 2px #e0b07a44}
.correa .slot.vacio::after{content:"";width:46%;height:46%;border-radius:50%;background:#1a0e05;box-shadow:inset 0 3px 6px #000}
.correa .slot .f{margin-top:-6px}
.correa .slot::before{content:"";position:absolute;left:4px;right:4px;bottom:6px;height:2px;border-top:2px dashed #e0b07a77;pointer-events:none}
.correa .num{display:none}
/* ---------- Abajo: alforja + nota ---------- */
.abajo{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:var(--gap)}
.alforja{--ch:var(--ca);position:relative;display:flex;flex-direction:column;gap:6px;padding:28px 12px 12px;border-radius:14px 14px 30px 30px;min-height:0;
  background:repeating-linear-gradient(0deg,#00000012 0 2px,transparent 2px 9px),linear-gradient(#6e4220,#3e2410);border:2px solid #2a1608;box-shadow:inset 0 0 0 3px #00000033,0 8px 16px #000a}
.alforja::before{content:"";position:absolute;left:-2px;right:-2px;top:-2px;height:24px;border-radius:14px 14px 40% 40%;background:linear-gradient(#8a5428,#5a3418);border:2px solid #2a1608;border-bottom:3px dashed #e0b07a88}
.alforja::after{content:"";position:absolute;left:50%;top:5px;width:18px;height:16px;transform:translateX(-50%);border-radius:4px;background:#eaa23a;box-shadow:0 0 0 2px #8a5a18}
.alforja .lbl{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.alforja .lbl small{font-size:14px;text-transform:none;letter-spacing:0;color:var(--bone-dim)}
.bolsa{display:grid;grid-template-columns:repeat(3,calc(var(--ch) + 8px));gap:6px;justify-content:center;align-content:center;flex:1;min-height:0}
.bolsa .slot{width:calc(var(--ch) + 8px);height:calc(var(--ch) + 8px);background:#1a0e0566;border-color:#e0b07a55}
.nota{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px}
.papel{flex:1;min-height:0;display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:6px;color:#2a1a0a;overflow:hidden;
  background:radial-gradient(120% 90% at 30% 20%,#f8eed8,#e8d6b0 70%,#d8c08e);box-shadow:0 6px 14px #000a,inset 0 0 30px #a0784055;transform:rotate(.4deg)}
.papel .f{--ch:clamp(48px,14vh,120px)}
.papel .t{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:safe center;gap:3px;overflow:hidden}
.papel .t>*{flex:none}
.papel h2{font:400 clamp(18px,3.6vh,30px)/1.05 var(--display);color:#2a1a0a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.papel .rar{font-size:16px;font-weight:700;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.papel .rar .pips i{border-color:#2a1a0a88;background:#2a1a0a22}.papel .rar .pips i.on{background:#c88a1a;border-color:#2a1a0a;box-shadow:none}
.papel .d{font-size:16px;line-height:1.2}
.papel .pr{font-size:14px;font-weight:700;color:#0d5a2a}
.papel .sig{font-size:14px;color:#6b3f0a}
.papel .donde{font-size:14px;color:#4a3a2a}
.papel .vacio{font-size:16px}.papel .vacio b{display:block;font:400 clamp(18px,3.2vh,26px) var(--display);margin-bottom:4px}
.acc{display:flex;gap:6px;flex:none}
.acc .btn{flex:1;min-width:0;padding:0 6px}
/* rareza en papel: colores oscuros para que se lean */
.rk-C{color:#4a4e54}.rk-B{color:#1a7a32}.rk-A{color:#1a4fb0}.rk-S{color:#9a6a00}
/* ---------- Perfil ---------- */
.perfil{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr 1fr;gap:var(--gap)}
.retrato{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;background:linear-gradient(#4a2e17,#2d1a0b);border:2px solid var(--brass-d);min-height:0}
.retrato img{height:clamp(80px,34vh,260px);aspect-ratio:1;border-radius:10px;border:5px solid #8a5a18;box-shadow:inset 0 0 0 2px #eaa23a,0 6px 12px #000a;background:#2a1a0e;min-height:0}
.retrato b{font:400 clamp(18px,3.6vh,28px)/1 var(--display);color:var(--gold)}
.retrato span{font-size:14px;color:var(--bone-dim);text-align:center}
.medallas{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:center;min-height:0}
.med{display:flex;flex-direction:column;justify-content:center;padding:4px 10px;border-radius:10px;background:linear-gradient(#f0c070,#c88a2a);color:#2a1a04;border:2px solid #fff4;box-shadow:0 3px 0 #8a5a18;cursor:pointer;min-height:48px}
.med small{font-size:14px;font-weight:700;color:#4a2a04}.med b{font-size:clamp(18px,3.4vh,26px);line-height:1;white-space:nowrap}
.med.on{outline:3px solid #fff;outline-offset:1px}
.cajon{display:flex;flex-direction:column;gap:8px;justify-content:center;padding:10px;border-radius:12px;background:#0b1f15cc;border:1px solid #ffffff22;min-height:0;overflow:hidden}
.cajon .objs{display:flex;gap:8px;flex-wrap:wrap}
.cajon .d{font-size:16px;line-height:1.2}.cajon .d b{color:var(--gold)}
.cajon .ult{font-size:14px;color:var(--bone-dim)}.cajon .ult b{color:var(--bone)}
[hidden]{display:none!important}
/* ---------- Medidas de las fichas ---------- */
:root{--cc:min(84px,12vh,calc((100vw - 260px)/8 - 12px));--ca:min(72px,9.5vh,calc((40vw - 80px)/3))}
@media (min-height:560px) and (orientation:landscape){
  :root{--cc:min(116px,15vh,calc((100vw - 260px)/8 - 12px));--ca:min(92px,12vh,calc((40vw - 80px)/3))}
  .papel .f{--ch:clamp(48px,22vh,170px)}.papel h2{font-size:clamp(26px,5vh,40px)}.papel .d{font-size:22px}.papel .rar,.papel .pr,.papel .sig,.papel .donde{font-size:17px}
}
@media (max-height:500px){
  :root{--cc:min(46px,11vh)}
  .canana-zona .lbl{display:none}.correa{padding:4px 46px 4px 56px}.correa .slot{height:calc(var(--ch) + 10px)}.correa .slot .f{margin-top:-2px}
  .alforja{padding:22px 8px 6px}.alforja::before{height:18px}.alforja::after{top:6px;height:16px}.alforja .lbl small{display:none}.bolsa{gap:4px}
  .papel{padding:6px 10px}.papel .d{font-size:14px}
  .retrato img{height:110px}.medallas{gap:5px}.med{min-height:44px;padding:2px 8px}.med b{font-size:18px}.cajon{padding:6px;gap:5px}.cajon .d{font-size:14px}
}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px;gap:6px}.top h1{flex:1 1 auto;order:-2;font-size:22px}.top .main{order:-1}.top .sp{display:none}.top .pill{padding:0 8px}#pills{flex:1}
  :root{--cc:min(70px,calc((100vw - 190px)/4 - 12px));--ca:min(60px,calc((100vw - 120px)/6))}
  .correa{padding:6px 22px 6px 44px}.correa::before{width:28px;left:8px;border-width:5px}.correa::after{width:22px}
  :root{--cc:min(70px,calc((100vw - 120px)/4 - 14px))}
  .abajo{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .alforja{padding:24px 10px 8px}.bolsa{grid-template-columns:repeat(6,calc(var(--ch) + 8px));gap:4px}
  .papel{flex-direction:column;justify-content:center;text-align:center}.papel .rar{justify-content:center}
  .perfil{grid-template-columns:1fr 1fr;grid-template-rows:auto auto minmax(0,1fr)}.retrato{grid-column:1/3;flex-direction:row;justify-content:flex-start}.retrato img{height:90px}.retrato div{display:flex;flex-direction:column;gap:4px;align-items:flex-start}.retrato span{text-align:left}
  .medallas{grid-column:1/3;grid-template-columns:1fr 1fr 1fr}.cajon{grid-column:1/3}
}
.retrato div{display:flex;flex-direction:column;align-items:center;gap:4px}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="inventario_encuesta.html">Diseños</a><h1>Inventario</h1><span class="sp"></span><span id="pills"></span><button class="btn main" id="bVolver">Volver al juego</button></div>
<div class="tabs" id="tabs"><button class="tab" data-v="balas">Balas</button><button class="tab" data-v="perfil">Perfil</button><span class="sp"></span><span class="cnt" id="cPar"></span></div>
<div class="cuerpo" id="vBalas">
 <div class="canana-zona" id="canana"></div>
 <div class="abajo">
  <div class="alforja"><div class="lbl">Reserva <b id="cRes"></b><small>no dan efecto</small></div><div class="bolsa" id="res"></div></div>
  <div class="nota"><div class="papel" id="papel"></div>
   <div class="acc"><button class="btn" id="bMover"></button><button class="btn" id="bJuntar"></button><button class="btn" id="bVender" data-drop="vender"></button></div></div>
 </div>
</div>
<div class="perfil" id="vPerfil" hidden></div>
</div>
<script>
let vista = 'balas';
const una = () => innerWidth > innerHeight;   // en horizontal, una sola correa con las 8; en vertical, dos correas cruzadas de 4
function pintar1() {
  $$('#tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.v === vista));
  $('#vBalas').hidden = vista !== 'balas'; $('#vPerfil').hidden = vista !== 'perfil';
  const ps = Z.parejas(); $('#cPar').textContent = ps.length ? `Parejas listas: ${ps.length}` : 'Sin parejas'; $('#cPar').className = 'cnt' + (ps.length ? '' : ' no');
  if (vista === 'perfil') return pintarPerfil();
  const h = i => hueco('cin:' + i);
  const ids = [0, 1, 2, 3, 4, 5, 6, 7];
  $('#canana').innerHTML = `<div class="lbl">Canana <b>${cuenta('cin')}</b> · dan efecto</div>` + (una() ? `<div class="correa">${ids.map(h).join('')}</div>` : `<div class="correa">${ids.slice(0, 4).map(h).join('')}</div><div class="correa">${ids.slice(4).map(h).join('')}</div>`);
  $('#res').innerHTML = Z.e.inv.map((_, i) => hueco('inv:' + i)).join(''); $('#cRes').textContent = cuenta('inv');
  const P = $('#papel'), D = INV.sel && detalle(INV.sel);
  if (!D) { P.innerHTML = `<div class="t"><div class="vacio"><b>${INV.cambio ? 'Elige con cuál cambiarla' : 'Toca una bala de la canana'}</b>2 balas iguales del mismo nivel se juntan en 1 del nivel siguiente (hasta Nv 4). Las que sobran van solas a la alforja.</div></div>`; encajar(P); return; }
  P.innerHTML = `${D.ficha()}<div class="t"><h2>${D.nombre}</h2><div class="rar"><span class="rk-${rareza(D.id)}">${D.rar}</span>${pips(D.nv)}<span>Nv ${D.nv} de 4</span></div>
    <div class="d">${D.ahora}</div>${D.par ? `<div class="pr">${D.par}</div>` : ''}<div class="donde opc">${INV.cambio ? 'Toca la bala con la que quieres cambiarla.' : D.donde.replace('reserva', 'alforja (reserva)')}</div><div class="sig opc">${D.sig}</div></div>`;
  encajar(P.querySelector('.t'));
}
function pintarPerfil() {
  const P = perfil(), o = INV.obj && P.objetos.find(x => x.k === INV.obj), s = INV.stat && P.stats.find(x => x.k === INV.stat);
  $('#vPerfil').innerHTML = `<div class="retrato"><img src="${P.pj.foto}" alt="${P.pj.nombre}"><div><b>${P.pj.nombre}</b><span>${P.pj.arma} · Pasiva: ${P.pj.pasiva}</span></div></div>
    <div class="medallas">${P.stats.map(x => `<div class="med${x.k === INV.stat ? ' on' : ''}" data-st="${x.k}"><small>${x.t}</small><b>${x.v}</b></div>`).join('')}</div>
    <div class="cajon"><div class="lbl">Objetos del misterio</div><div class="objs">${P.objetos.map(x => `<span class="obj${x.tiene ? '' : ' no'}${x.k === INV.obj ? ' on' : ''}" data-obj="${x.k}" title="${x.nombre}">${objetoSVG(x.k)}</span>`).join('')}</div>
    <div class="d">${o ? `<b>${o.nombre}</b> · ${o.tiene ? o.tipo : 'No lo tienes'}. ${o.d}` : s ? `<b>${s.t}: ${s.v}</b>. ${s.d}` : 'Toca una medalla o un objeto para saber de dónde sale. Solo cuentan las balas de la canana.'}</div>
    <div class="ult opc"><b>Ultimate: ${P.pj.ulti}.</b> ${P.pj.ultiD}</div></div>`;
  encajar($('#vPerfil .cajon'));
}
iniciarInv({ render: pintar1, root: $('.frame') });
$('#tabs').onclick = e => { const t = e.target.closest('[data-v]'); if (!t) return; vista = t.dataset.v; Son.clic(); render(); };
$('#vPerfil').onclick = e => { const o = e.target.closest('[data-obj]'), s = e.target.closest('[data-st]'); if (o) { INV.obj = o.dataset.obj; INV.stat = null; } else if (s) { INV.stat = s.dataset.st; INV.obj = null; } else return; Son.ficha(); render(); FX.rebote($(`[data-obj="${INV.obj}"],[data-st="${INV.stat}"]`), 1.12); };
// al juntar, la correa se sacude como si el cuero se tensara
INV.alJuntar = el => FX.sacudir(el?.closest('.correa'));
</script></body></html>
