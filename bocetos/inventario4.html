<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario 4 · Vitrina y cinturón</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css"><link rel="stylesheet" href="inventario.css">
<script src="fichas.js"></script><script src="vivo.js"></script><script src="inventario.js"></script>
<style>
/* Diseño 4: igual que la expendedora elegida (60 % / 40 %). A la izquierda una vitrina verde con tu bala en grande (o tu perfil);
   a la derecha el cinturón de cuero y la reserva, idénticos a los de la expendedora. */
.lay{flex:1;min-height:0;display:grid;grid-template-columns:3fr 2fr;gap:var(--gap)}
.vm{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:14px;background:linear-gradient(90deg,#0b2e26,#0e3a30 18%,#0e3a30 82%,#0b2e26);border:3px solid #2a9a6a;box-shadow:inset 0 0 0 3px #062019,0 8px 22px #000a,0 0 18px #2a9a6a44}
.tabs{display:flex;gap:6px;flex:none}
.tab{flex:1;min-height:48px;border-radius:10px;border:2px solid #ffffff33;background:#0005;color:var(--bone);font:600 16px var(--hud);cursor:pointer}
.tab.on{background:var(--bone);color:var(--ink);border-color:var(--gold)}
.vidrio{flex:1;min-height:0;position:relative;border-radius:8px;background:linear-gradient(#1a3036,#0d1b1f);box-shadow:inset 0 0 0 3px #c8ccd4,inset 0 0 22px #000c;padding:10px 12px;overflow:hidden;display:flex;gap:14px;align-items:center}
.vidrio::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,#fff0 34%,#ffffff12 40%,#fff0 47%);pointer-events:none}
.vidrio .grande{flex:none;display:flex;align-items:center;justify-content:center;width:var(--g);height:var(--g);position:relative;--g:clamp(64px,28vh,190px)}
.vidrio .grande .f{--ch:var(--g)}
.vidrio .grande .f .nv{min-width:30px;height:30px;border-radius:15px;font-size:18px;line-height:26px}
.vidrio .t{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:safe center;gap:4px;overflow:hidden}
.vidrio .t>*{flex:none}
.vidrio h2{font:400 clamp(20px,4vh,30px)/1.05 var(--display);color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vidrio .rar{font-size:16px;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;white-space:nowrap}
.lay.en-perfil .acc,.lay.en-perfil #bRecibir{display:none}
.vidrio .d{font-size:16px;color:var(--bone);line-height:1.2}
.vidrio .sig{font-size:14px;color:var(--gold);line-height:1.2}
.vidrio .donde{font-size:14px;color:#7affc0}
.vidrio .pr{font-size:14px;color:#8dffaa;font-weight:700}
.vidrio .ladder{font-size:14px;gap:3px 10px}
.vidrio .ladder .yo{color:var(--gold)}.vidrio .ladder .yo+span{color:var(--bone)}
.vidrio .vacio{color:var(--bone-dim);font-size:16px}
.vidrio .vacio b{display:block;font:400 clamp(18px,3.4vh,26px) var(--display);color:#7affc0;margin-bottom:6px}
/* Perfil dentro de la vitrina */
.vidrio.perfil{align-items:stretch}
.pf-yo{flex:none;width:min(40%,240px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:0}
.pf-yo img{width:auto;height:auto;max-width:100%;max-height:min(30vh,170px);min-height:0;flex:0 1 auto;aspect-ratio:1;border-radius:12px;border:3px solid var(--brass);background:#2a1a0e;object-fit:cover}
.pf-yo b{font:400 clamp(16px,3vh,22px)/1.05 var(--display);color:var(--gold)}
.pf-yo span{font-size:14px;color:var(--bone-dim)}
.pf-yo div{display:flex;flex-direction:column;gap:2px;min-width:0}
.pf-der{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:center;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.st{border-radius:8px;background:#031a0e;border:2px solid #2a9a6a;padding:3px 8px;display:flex;flex-direction:column;cursor:pointer;min-height:44px;justify-content:center}
.st small{font-size:14px;color:#7affc0}.st b{font-size:18px;color:#c8ffe4;white-space:nowrap}
.st.on{border-color:var(--gold)}
.objs{display:flex;gap:6px;flex-wrap:wrap}
.pf-txt{font-size:14px;color:var(--bone);min-height:34px;line-height:1.2}
.pf-txt b{color:var(--gold)}
.acc{display:flex;gap:6px;flex:none}
.acc .btn{flex:1;padding:0 6px;min-width:0}
/* ---------- Cinturón y reserva (los mismos de la expendedora) ---------- */
.inv{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px;border-radius:14px;background:linear-gradient(#3a2412,#22140a);border:2px solid var(--brass-d);box-shadow:inset 0 0 0 2px #00000055;
  --cr:min(84px,10.5vh,calc((40vw - 90px)/6));--cb:min(84px,10.5vh,calc((40vw - 90px)/4))}
.inv .lbl{display:flex;align-items:center;gap:6px}
.inv .lbl .sp{flex:1}
.inv .lbl small{font-size:14px;text-transform:none;letter-spacing:0}
.cnt{font:700 14px/1 var(--hud);padding:3px 7px;border-radius:8px;background:#0d3a1e;color:#8dffaa;border:1px solid #5bd17a;text-transform:none;letter-spacing:0}
.cnt.no{background:#0006;color:var(--bone-dim);border-color:#ffffff33}
.belt{--ch:var(--cb);display:grid;grid-template-columns:repeat(4,calc(var(--ch) + 4px));gap:6px 10px;justify-content:center;padding:6px 8px;border-radius:12px}
.reserva{--ch:var(--cr);display:grid;grid-template-columns:repeat(6,calc(var(--ch) + 4px));gap:5px;justify-content:center;padding:4px 6px;border-radius:12px;background:#0004;border:1px dashed #e0b07a55}
.inv .slot{width:calc(var(--ch) + 4px);height:calc(var(--ch) + 4px)}
.nota{font-size:14px;color:var(--bone-dim);line-height:1.2;text-align:center}
.nota b{color:var(--bone)}
.prueba{min-height:48px}
@media (max-height:500px){.nota{display:none}.vidrio{padding:6px 10px}.vidrio .d{font-size:14px}.vidrio h2{font-size:20px}
  .pf-yo{width:130px}.pf-yo img{max-height:96px}.pf-der .lbl{display:none}.st{min-height:40px;padding:2px 6px}.st small{line-height:1}.st b{font-size:16px}.objs{flex-wrap:nowrap}.pf-der{gap:5px}}
@media (min-height:560px) and (orientation:landscape){.vidrio .grande{--g:clamp(64px,32vh,250px)}.vidrio h2{font-size:clamp(28px,5.4vh,44px)}.vidrio .d{font-size:22px}.vidrio .ladder{font-size:17px}.vidrio .rar,.vidrio .donde,.vidrio .pr{font-size:17px}
  .inv{--cb:min(96px,12.5vh,calc((40vw - 90px)/4))}.pf-txt{font-size:16px}}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px;gap:6px}.top h1{flex:1 1 auto;order:-2;font-size:22px}.top .main{order:-1}.top .sp{display:none}.top .pill{padding:0 8px}#pills{flex:1}
  .lay{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
  .inv{order:-1;--cr:calc((100vw - 136px)/6);--cb:min(72px,calc((100vw - 120px)/4))}.nota{display:none}
  .vidrio{gap:10px}.vidrio .grande{--g:clamp(64px,12vh,120px)}.vidrio h2{font-size:22px}
  .vidrio.perfil{flex-direction:column;align-items:stretch}.pf-der .lbl{display:none}.pf-yo{width:auto;flex-direction:row;justify-content:flex-start;text-align:left;gap:10px}.pf-yo img{max-height:68px;width:68px}.pf-yo span{display:none}.pf-yo span.pj2{display:block}}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="inventario_encuesta.html">Diseños</a><h1>Inventario</h1><span class="sp"></span><span id="pills"></span><button class="btn main" id="bVolver">Volver al juego</button></div>
<div class="lay">
 <div class="vm">
  <div class="tabs" id="tabs"><button class="tab" data-v="bala">Tu bala</button><button class="tab" data-v="perfil">Perfil</button></div>
  <div class="vidrio" id="vista"></div>
  <div class="acc"><button class="btn" id="bMover"></button><button class="btn" id="bJuntar"></button><button class="btn" id="bVender" data-drop="vender"></button></div>
 </div>
 <div class="inv">
  <div class="lbl">Cinturón <b id="cCin"></b><span class="sp"></span><span class="cnt" id="cPar"></span></div>
  <div class="belt leather" id="cin"></div>
  <div class="lbl">Reserva <b id="cRes"></b><span class="sp"></span><small>no dan efecto</small></div>
  <div class="reserva" id="res"></div>
  <div class="nota"><b>2 iguales del mismo nivel</b> = 1 del nivel siguiente (hasta Nv 4). Las que sobran van solas a la reserva.</div>
  <button class="btn prueba" id="bRecibir">Recibir una bala (prueba)</button>
 </div>
</div></div>
<script>
let vista = 'bala';
function pintar4() {
  $$('#tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.v === vista));
  $('#cin').innerHTML = Z.e.cin.map((_, i) => hueco('cin:' + i)).join('');
  $('#res').innerHTML = Z.e.inv.map((_, i) => hueco('inv:' + i)).join('');
  $('#cCin').textContent = cuenta('cin'); $('#cRes').textContent = cuenta('inv');
  const ps = Z.parejas(); $('#cPar').textContent = ps.length ? `Parejas listas: ${ps.length}` : 'Sin parejas'; $('#cPar').className = 'cnt' + (ps.length ? '' : ' no');
  const V = $('#vista'); V.classList.toggle('perfil', vista === 'perfil'); $('.lay').classList.toggle('en-perfil', vista === 'perfil');
  if (vista === 'perfil') {
    const P = perfil(), o = INV.obj && P.objetos.find(x => x.k === INV.obj), s = INV.stat && P.stats.find(x => x.k === INV.stat);
    V.innerHTML = `<div class="pf-yo"><img src="${P.pj.foto}" alt="${P.pj.nombre}"><div><b>${P.pj.nombre}</b><span>${P.pj.arma} · Vida ${P.pj.vida}</span><span class="pj2">Pasiva: ${P.pj.pasiva}. ${P.pj.pasivaD}</span></div></div>
      <div class="pf-der"><div class="stats">${P.stats.map(x => `<div class="st${x.k === INV.stat ? ' on' : ''}" data-st="${x.k}"><small>${x.t}</small><b>${x.v}</b></div>`).join('')}</div>
      <div class="lbl">Objetos del misterio</div><div class="objs">${P.objetos.map(x => `<span class="obj${x.tiene ? '' : ' no'}${x.k === INV.obj ? ' on' : ''}" data-obj="${x.k}" title="${x.nombre}">${objetoSVG(x.k)}</span>`).join('')}</div>
      <div class="pf-txt d">${o ? `<b>${o.nombre}</b> · ${o.tiene ? o.tipo : 'No lo tienes'}. ${o.d}` : s ? `<b>${s.t}: ${s.v}</b>. ${s.d}` : 'Toca un número o un objeto para saber de dónde sale. Solo cuentan las balas del cinturón.'}</div></div>`;
    encajar(V.querySelector('.pf-der'));
    return;
  }
  const D = INV.sel && detalle(INV.sel);
  if (!D) {
    V.innerHTML = `<div class="t"><div class="vacio"><b>${INV.cambio ? 'Elige con cuál cambiarla' : 'Toca una bala para verla'}</b>Las que brillan en verde tienen pareja. También puedes arrastrarlas.</div></div>`; return;
  }
  const ladder = [1, 2, 3, 4].map(n => `<b class="${n === D.nv ? 'yo' : ''}">Nv ${n}</b><span>${DATOS[D.id][4][n - 1]}</span>`).join('');
  V.innerHTML = `<div class="grande">${D.ficha({ cls: D.nv >= NIVEL_MAX ? 'glow' : '', style: '--gc:' + brillo(D.id) })}</div>
    <div class="t"><h2>${D.nombre}</h2><div class="rar"><span style="color:${D.rcol}">${D.rar}</span>${pips(D.nv)}<span>Nv ${D.nv} de 4</span></div>
    <div class="d">${D.ahora}</div>${D.par ? `<div class="pr">${D.par}</div>` : ''}<div class="donde opc">${INV.cambio ? 'Toca la bala con la que quieres cambiarla.' : D.donde}</div>
    <div class="ladder opc">${ladder}</div><div class="sig opc">${D.sig}</div></div>`;
  if (innerHeight > 560 && innerWidth > innerHeight) V.querySelector('.sig')?.remove(); else V.querySelector('.ladder')?.remove();
  encajar(V.querySelector('.t'));
}
iniciarInv({ render: pintar4, root: $('.lay') });
const _tocar = tocar; tocar = k => { vista = 'bala'; _tocar(k); };
$('#tabs').onclick = e => { const t = e.target.closest('[data-v]'); if (!t) return; vista = t.dataset.v; Son.clic(); render(); };
$('#vista').onclick = e => { const o = e.target.closest('[data-obj]'), s = e.target.closest('[data-st]'); if (o) { INV.obj = o.dataset.obj; INV.stat = null; } else if (s) { INV.stat = s.dataset.st; INV.obj = null; } else return; Son.ficha(); render(); FX.rebote(o || s, 1.12); };
$('#bRecibir').onclick = () => recibir($('#bRecibir'));
</script></body></html>
