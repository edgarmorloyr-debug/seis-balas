<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encuesta del inventario</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css">
<script src="fichas.js"></script>
<style>
/* Encuesta del inventario (20-oct-2026): 4 diseños nuevos con lo que gustó de la expendedora. Se prueba cada uno y se elige. */
.top .lbl{white-space:normal}
.lista{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.op{min-width:0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;background:#0b1f15cc;border:2px solid #ffffff22;overflow:hidden}
.op.elegido{border-color:var(--gold);box-shadow:0 0 0 3px #ffd27a55,0 0 18px #ffd27a66;background:#2a200acc}
.op .hd{display:flex;align-items:center;gap:10px}
.op .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--bone);color:var(--ink);font:700 22px/40px var(--hud);text-align:center}
.op h2{font:400 clamp(17px,3vh,24px)/1.05 var(--display);color:var(--gold)}
.op .fichas{display:flex;gap:4px;--ch:clamp(30px,6vh,48px)}
.op p{font-size:16px;line-height:1.2;color:var(--bone)}
.op p.dif{color:var(--bone-dim);font-size:14px}
.op .sp{flex:1}
.op .bs{display:flex;gap:6px}
.op .bs .btn{flex:1;min-width:0;padding:0 8px}
.op .elegir.on{background:#3a2a0a;border-color:var(--gold);color:var(--gold)}
.pie{display:flex;align-items:center;gap:10px;min-height:48px}
.pie .txt{flex:1;font-size:16px}
.pie .txt b{color:var(--gold)}
@media (max-height:500px){.op .fichas,.op p.dif{display:none}.op{padding:8px}.op p{font-size:14px}.top .lbl{display:none}}
@media (orientation:portrait){
  .top .lbl{display:none}.top h1{font-size:20px;min-width:0}
  .lista{grid-template-columns:1fr;grid-template-rows:repeat(4,minmax(0,1fr))}
  .op{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr auto;gap:4px 8px;padding:8px 10px}
  .op .hd{grid-column:1/3}.op p{grid-column:1/3;font-size:14px}.op .n{width:34px;height:34px;line-height:34px;font-size:19px}.op h2{font-size:18px}.op .fichas,.op p.dif,.op .sp{display:none}.op .bs{grid-column:1/3}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Inventario: 4 diseños</h1><span class="lbl">Prueba los 4 y quédate con uno (o pide una mezcla)</span></div>
<div class="lista" id="lista"></div>
<div class="pie"><div class="txt" id="txt"></div></div>
</div>
<script>
const OP = [
  { f: 'inventario1.html', n: 'Canana de pistolero', d: 'La canana con las 8 balas cruza toda la pantalla. Abajo, la alforja con la reserva y una nota de papel con la bala elegida.', dif: 'Perfil en su propia pestaña, con medallas de latón.', b: ['polvora', 'oro', 'escarcha'] },
  { f: 'inventario2.html', n: 'Mano de cartas', d: 'Como Balatro: el cinturón es tu mano de 8 cartas en abanico y la reserva es la fila de cartas de arriba.', dif: 'El panel del personaje queda siempre a la izquierda.', b: ['rey', 'jackpot', 'apuesta'] },
  { f: 'inventario3.html', n: 'Mesa del saloon', d: 'Tus 8 balas son fichas apostadas en tu lado de la mesa de póker; la reserva va en un baúl abierto.', dif: 'Tu perfil es el cartel de «Se busca» en la pared.', b: ['oro', 'robot', 'rey'] },
  { f: 'inventario4.html', n: 'Vitrina y cinturón', d: 'Igual que la expendedora elegida: 60 % vitrina verde con tu bala en grande, 40 % el mismo cinturón y la misma reserva.', dif: 'Lo más parecido a lo que ya te gustó.', b: ['escarcha', 'polvora', 'jackpot'] },
];
let voto = null; try { voto = localStorage.getItem('enc_inventario'); } catch (e) { /* sin almacenamiento */ }
function pinta() {
  document.getElementById('lista').innerHTML = OP.map((o, i) => `<div class="op${voto == i ? ' elegido' : ''}"><div class="hd"><span class="n">${i + 1}</span><h2>${o.n}</h2></div>
    <div class="fichas">${o.b.map(id => ficha(id, 1 + (id.length % 3))).join('')}</div><p>${o.d}</p><p class="dif">${o.dif}</p><span class="sp"></span>
    <div class="bs"><a class="btn" href="${o.f}">Probar</a><button class="btn elegir${voto == i ? ' on' : ''}" data-i="${i}">${voto == i ? 'Elegido' : 'Elegir este'}</button></div></div>`).join('');
  document.getElementById('txt').innerHTML = voto !== null && voto !== '' ? `Tu elección: <b>${+voto + 1} · ${OP[+voto].n}</b>. Dímelo en el chat (o pide una mezcla).` : 'Toca «Probar» para abrir cada diseño; dentro, «Diseños» te trae de vuelta aquí.';
}
document.getElementById('lista').onclick = e => { const b = e.target.closest('[data-i]'); if (!b) return; voto = b.dataset.i; try { localStorage.setItem('enc_inventario', voto); } catch (er) { /* sin almacenamiento */ } pinta(); };
pinta();
</script></body></html>
