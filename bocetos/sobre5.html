<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sobre 5</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css">
<script src="fichas.js"></script><script src="sobres.js"></script><script src="vivo.js"></script><script src="apertura.js"></script>
<style>
.lay{flex:1;min-height:0;display:flex;gap:calc(var(--gap)*2);align-items:center;justify-content:center}
.pk{height:100%;aspect-ratio:240/340;flex:none;filter:drop-shadow(0 18px 18px #000a);cursor:pointer;touch-action:manipulation}
.pk svg{width:100%;height:100%;animation:bob 2s ease-in-out infinite}
.info{display:flex;flex-direction:column;gap:8px;max-width:420px;min-width:0}
.info h2{font:400 clamp(20px,4vh,30px) var(--display);color:var(--gold)}
.aps{display:flex;gap:6px}.aps .btn{padding:0;width:48px;font-size:18px}.aps .btn.on{background:var(--bone);color:var(--ink);border-color:var(--gold)}
@media (orientation:portrait){.lay{flex-direction:column;justify-content:center}.pk{height:auto;width:min(62vw,40vh)}.info{width:100%}}
</style></head><body>
<div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Sobre 5</h1><span class="sp"></span><a class="btn" href="sobre1.html">Siguiente sobre</a></div>
<div class="lay">
 <div class="pk" id="p"></div>
 <div class="info">
  <h2 id="h"></h2><div class="txt" id="d"></div>
  <div class="lbl">Elige la apertura</div>
  <div class="aps" id="aps"></div>
  <div class="txt" id="apN"></div>
  <button class="btn main" id="bAbrir">Abrir sobre</button>
 </div>
</div></div>
<script>
const N = 5, S = SOBRES[N - 1]; guardar('zg_sobre', N);
document.getElementById('p').innerHTML = sobreSVG(N);
document.getElementById('h').textContent = S.name;
document.getElementById('d').innerHTML = '<b>' + S.tier + '</b> · ' + S.d;
let ap = apElegida();
function pintar() {
  document.getElementById('aps').innerHTML = [1, 2, 3, 4, 5].map(i => '<button class="btn' + (i === ap ? ' on' : '') + '" data-a="' + i + '" aria-label="Apertura ' + i + '">' + i + '</button>').join('');
  document.getElementById('apN').innerHTML = 'Apertura ' + ap + ': <b>' + nombreAp(ap) + '</b>';
}
pintar();
document.getElementById('aps').onclick = e => { const b = e.target.closest('[data-a]'); if (!b) return; ap = +b.dataset.a; guardar('zg_apertura', ap); pintar(); Son.clic(); };
const abrir = () => abrirVentanaSobre({ anim: ap, sobre: N, titulo: S.name });
document.getElementById('bAbrir').onclick = abrir; document.getElementById('p').onclick = abrir;
</script></body></html>
