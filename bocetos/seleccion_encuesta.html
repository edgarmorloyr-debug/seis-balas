<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuesta · Selección de personaje</title>
<style>
/* Encuesta: las 5 propuestas de selección de personaje «estilo foto de pasaporte». Se ve cada una aquí mismo y se vota. */
*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden;background:#1a120c;color:#f3e6cf;font:15px system-ui,sans-serif}
.app{display:flex;flex-direction:column;height:100%}
.tabs{display:flex;gap:4px;padding:4px}
.tabs button{flex:1;min-height:48px;min-width:0;border:1px solid #6b4a2a;border-radius:8px;background:#2a1c12;color:#f3e6cf;font:600 14px system-ui;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tabs button.on{background:#5a3a1c;border-color:#e9b25a;color:#ffd98a}
.tabs .v{color:#7fd17f}
.vista{flex:1;min-height:0;position:relative;overflow:hidden;background:#000}
iframe{position:absolute;left:50%;top:0;border:0;background:#000;transform-origin:top center}
.bar{display:flex;gap:8px;align-items:center;padding:6px 8px}
.bar .t{flex:1;font-size:14px;line-height:1.3;min-width:0}
.bar .t b{color:#ffd98a}
.voto{min-height:48px;padding:0 16px;border:0;border-radius:10px;background:#f08a24;color:#1a0f05;font:700 15px system-ui;cursor:pointer;white-space:nowrap}
.sec{min-height:48px;padding:0 14px;border:1px solid #6b4a2a;border-radius:10px;background:#2a1c12;color:#f3e6cf;font:600 14px system-ui;cursor:pointer;white-space:nowrap}
@media (max-width:640px){.bar{flex-wrap:wrap}.bar .t{flex-basis:100%}.bar .t span{display:none}.bar button{flex:1}}
@media (max-height:500px){.bar .t span{display:none}}
</style></head><body><div class="app">
<div class="tabs" id="tabs" role="tablist"></div>
<div class="vista" id="vista"><iframe id="fr" title="Propuesta"></iframe></div>
<div class="bar"><div class="t" id="t"></div><button class="sec" id="sig">Siguiente</button><button class="voto" id="vot">Elegir esta</button></div>
</div>
<script>
const M=[
 ['seleccion1.html','1 · Pasaporte con sellos','La página abierta de un pasaporte del Oeste, con sellos de visa y una línea de letras como los pasaportes de verdad.','Al cambiar de personaje la página entra deslizándose y cae un sello: «Aprobado» o «Bloqueado».'],
 ['seleccion2.html','2 · Cédula «Se busca»','Mitad carné plastificado y mitad cartel de «Se busca» clavado en la pared del saloon.','Al cambiar, la cédula gira como una carta y un brillo la recorre; si está bloqueado, una banda roja.'],
 ['seleccion3.html','3 · Tira de fotomatón','La cabina de fotos con cortina roja: una tira de tres fotos del personaje y un boleto con sus datos.','Al cambiar hay un destello de flash y las fotos se revelan una a una; abajo, la fila es una película.'],
 ['seleccion4.html','4 · Expediente engrapado','Una hoja escrita a máquina en una carpeta, con la foto sujeta por un clip y grapas arriba.','Al cambiar, la foto cae y el clip la sujeta; si está bloqueado, sello «Archivo cerrado» y nota amarilla con cómo abrirlo.'],
 ['seleccion5.html','5 · Control de paso','El escritorio del guardia de la frontera: el pasaporte abierto en dos páginas, foto y datos a la izquierda, pasiva y ultimate a la derecha.','Al cambiar, el pasaporte se desliza por la mesa y el guardia sella «Pasa» o «No pasa».']];
let i=0,v=null;try{v=localStorage.getItem('enc_seleccion')}catch(e){}
const tabs=document.getElementById('tabs'),fr=document.getElementById('fr'),t=document.getElementById('t');
function pinta(){tabs.innerHTML='';M.forEach((m,k)=>{const b=document.createElement('button');b.className=k===i?'on':'';b.setAttribute('role','tab');b.setAttribute('aria-selected',k===i);b.innerHTML=(v==k&&v!==null?'<span class="v">Tu voto · </span>':'')+(innerWidth<900?String(k+1):m[1]);b.title=m[1];b.setAttribute('aria-label',m[1]);b.onclick=()=>{i=k;ir()};tabs.appendChild(b)});
 t.innerHTML=`<b>${M[i][1]}.</b> ${M[i][2]} <span>${M[i][3]}</span>`+(v!==null&&v!==''?` <b>Tu elección: ${M[+v][1]}.</b>`:'')}
// la propuesta se ve con el tamaño completo de la pantalla y se achica para caber (así se ve igual que en el juego)
function escala(){const box=document.getElementById('vista'),W=innerWidth,H=innerHeight,k=Math.min(box.clientWidth/W,box.clientHeight/H);fr.style.width=W+'px';fr.style.height=H+'px';fr.style.transform=`translateX(-50%) scale(${k})`}
function ir(){fr.src=M[i][0];pinta();escala()}
document.getElementById('sig').onclick=()=>{i=(i+1)%M.length;ir()};
document.getElementById('vot').onclick=()=>{v=String(i);try{localStorage.setItem('enc_seleccion',v)}catch(e){}pinta()};
addEventListener('resize',()=>{pinta();escala()});
ir();
</script></body></html>
