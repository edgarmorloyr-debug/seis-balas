<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Menú de la expendedora</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css">
<script src="fichas.js"></script><script src="sobres.js"></script><script src="vivo.js"></script><script src="apertura.js"></script>
<style>
.vm{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:linear-gradient(#8e1f16,#4f0e09);border:3px solid var(--brass);box-shadow:inset 0 0 0 4px #2a0805}
.tabs{display:flex;gap:6px}
.tab{flex:1;min-height:48px;border-radius:10px;border:2px solid #ffffff33;background:#0005;color:var(--bone);font:600 16px var(--hud);display:flex;align-items:center;justify-content:center;white-space:nowrap;cursor:pointer;padding:0 6px}
.tab.on{background:var(--bone);color:var(--ink);border-color:var(--gold)}
.col{flex:1;display:flex;flex-direction:column;gap:4px;border-radius:12px;background:linear-gradient(115deg,#1d3a4a,#0e1c26 60%,#16303e);box-shadow:inset 0 0 0 3px #111,inset 0 0 20px #000c;padding:6px 8px;min-height:0;position:relative;overflow:hidden}
.col::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff0 30%,#ffffff18 38%,#fff0 46%);pointer-events:none}
.col .sub{font-size:14px;color:var(--bone-dim)}.col .sub.lim{color:var(--gold)}
.items{flex:1;min-height:0;display:flex;gap:8px;align-items:stretch;justify-content:center}
.it{flex:1;max-width:260px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-bottom:3px solid #6b7680;padding-bottom:4px;position:relative;cursor:pointer;border-radius:8px 8px 0 0}
.it .img{flex:0 1 auto;height:calc(var(--ch)*2.3);min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center}
.it .img svg{height:100%;max-height:100%;width:auto;max-width:100%;filter:drop-shadow(0 6px 6px #000a)}
.it .img .f{--ch:clamp(44px,15vh,120px)}
.it .nm{font-size:16px;color:var(--bone);text-align:center;line-height:1.05;white-space:nowrap}
.tag{font:700 14px/1 var(--hud);background:var(--bone);color:var(--ink);padding:3px 6px;border-radius:4px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.tag i{width:12px;height:12px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 2px #b8860b}
.it.sel{outline:3px solid var(--gold);outline-offset:-1px;background:#ffd27a1a}
.it.gone{opacity:.4}.it.gone .tag{background:#555;color:#ddd}
.it.hot::before{content:"HOY";position:absolute;top:6px;left:6px;z-index:2;font:700 14px/1 var(--hud);background:var(--blood);color:#fff;padding:3px 5px;border-radius:4px}
.bar{display:flex;align-items:center;gap:10px}
.bar .txt{flex:1;min-width:0}
.pill .bala{width:8px;height:18px;border-radius:4px 4px 1px 1px;background:linear-gradient(#e8c06a,#b8860b);box-shadow:none}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px}.top h1{flex-basis:100%;order:-1}.top .lbl{display:none}
  .bar{flex-wrap:wrap}.bar .txt{flex-basis:100%}.bar .btn{flex:1}
  .items{flex-direction:column;align-items:center}.it{flex-direction:row;width:100%;max-width:none;gap:12px;justify-content:flex-start;padding:4px 10px}
  .it .img{width:auto;height:calc(var(--ch)*1.5);flex:none}.it .img .f{--ch:clamp(44px,12vw,72px)}
  .it .nm{flex:1;text-align:left}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Expendedora</h1><span class="lbl">Elige un producto</span><span class="sp"></span><span class="pill"><i></i><b id="pOro">600</b></span><span class="pill" title="Balas normales"><i class="bala"></i><b id="pNor">0</b></span><button class="btn" id="bReiniciar">Reiniciar</button></div>
<div class="vm">
 <div class="tabs" id="tabs"><span class="tab" data-t="sobres">Sobres</span><span class="tab" data-t="cajas">Cajas</span><span class="tab" data-t="oferta">Oferta de hoy</span></div>
 <div class="col"><div class="sub" id="sub"></div><div class="items" id="items"></div></div>
 <div class="bar"><div class="txt" id="txt"></div><button class="btn main" id="bComprar">Comprar</button></div>
</div>
</div>
<script>
const PROD = {
  sobres: { sub: '3 balas especiales al azar · se abren con la Tragamonedas', items: [{ n: SOBRE_DE.Standard, nom: 'Standard', p: 50, d: '3 balas, casi todas comunes' }, { n: SOBRE_DE.Terminator, nom: 'Terminator', p: 100, d: '3 balas: más poco comunes y alguna rara' }, { n: SOBRE_DE.Especial, nom: 'Especial', p: 300, d: '3 balas: muchas raras y a veces una legendaria' }] },
  cajas: { sub: 'Balas normales para tu arma', items: [{ c: 25, nom: 'Caja de 25', p: 15, d: '25 balas normales' }, { c: 50, nom: 'Caja de 50', p: 25, d: '50 balas normales, más barata por bala' }] },
  oferta: { sub: '1 bala por compra · cada una se vende una sola vez', items: [{ id: 'escarcha' }, { id: 'relampago' }, { id: 'hipnotica' }] },
};
let E; function nuevo() { E = { oro: 600, nor: 0, tab: 'sobres', sel: 1, vendidas: new Set(), ocup: false }; } nuevo();
const precio = it => it.p ?? PRECIO[rareza(it.id)];
function caja(n) { let b = ''; const rows = n > 30 ? 2 : 1; for (let r = 0; r < rows; r++) for (let i = 0; i < 5; i++) b += `<rect x="${38 + i * 26 + r * 13}" y="${44 - r * 16}" width="14" height="40" rx="7" fill="#d9a441" stroke="#7a5a18" stroke-width="2"/><rect x="${38 + i * 26 + r * 13}" y="${66 - r * 16}" width="14" height="18" fill="#b8860b"/>`;
  return `<svg viewBox="0 0 200 170"><g>${b}</g><path d="M20 80 L180 80 L172 160 L28 160 Z" fill="#4f6b3a" stroke="#22301a" stroke-width="4"/><rect x="20" y="74" width="160" height="14" fill="#6b8a4a" stroke="#22301a" stroke-width="3"/><rect x="58" y="100" width="84" height="40" rx="4" fill="#f6ead7" stroke="#22301a" stroke-width="2"/><text x="100" y="130" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="28" fill="#22301a">${n}</text></svg>`; }
function render() {
  $$('#tabs .tab').forEach(t => t.classList.toggle('on', t.dataset.t === E.tab));
  const P = PROD[E.tab]; $('#sub').textContent = P.sub; $('#sub').className = 'sub' + (E.tab === 'oferta' ? ' lim' : '');
  $('#items').innerHTML = P.items.map((it, i) => {
    const gone = E.tab === 'oferta' && E.vendidas.has(it.id);
    const img = E.tab === 'sobres' ? sobreSVG(it.n) : E.tab === 'cajas' ? caja(it.c) : ficha(it.id, 1);
    return `<div class="it${i === E.sel ? ' sel' : ''}${gone ? ' gone' : ''}${E.tab === 'oferta' && i === 0 ? ' hot' : ''}" data-i="${i}"><div class="img">${img}</div><span class="nm">${it.nom || nombre(it.id)}</span><span class="tag"><i></i>${gone ? 'Vendida' : precio(it)}</span></div>`;
  }).join('');
  const it = P.items[E.sel], gone = E.tab === 'oferta' && E.vendidas.has(it.id);
  $('#txt').innerHTML = E.tab === 'oferta' ? `<b style="color:${rcol(it.id)}">${nombre(it.id)}</b> <small>· ${RNOM[rareza(it.id)]} · ${queHace(it.id, 1)}</small>` : `Sobre ${it.nom || ''}`.replace('Sobre Caja', 'Caja') + ` <small>· ${it.d}</small>`;
  const b = $('#bComprar'); b.textContent = gone ? 'Vendida' : 'Comprar · ' + precio(it); b.disabled = gone || E.ocup;
}
function pagar(p) { if (E.oro < p) { FX.toast('No te alcanza el oro', true); return false; } const a = E.oro; E.oro -= p; FX.contar($('#pOro'), a, E.oro, 500, true); Son.moneda(); return true; }
$('#tabs').onclick = e => { const t = e.target.closest('[data-t]'); if (!t || E.ocup) return; E.tab = t.dataset.t; E.sel = E.tab === 'sobres' ? 1 : 0; Son.clic(); render(); };
$('#items').onclick = e => { const d = e.target.closest('[data-i]'); if (!d || E.ocup) return; E.sel = +d.dataset.i; Son.clic(); render(); FX.rebote(d.querySelector('.img'), 1.08); };
$('#bComprar').onclick = async () => {
  if (E.ocup) return; const P = PROD[E.tab], it = P.items[E.sel];
  if (E.tab === 'oferta' && E.vendidas.has(it.id)) return;
  if (!pagar(precio(it))) return;
  if (E.tab === 'sobres') { E.ocup = true; render(); abrirVentanaSobre({ anim: 6, sobre: it.n, titulo: 'Sobre ' + it.nom, alOtro: () => pagar(it.p), alCerrar: lista => { E.ocup = false; render(); FX.toast(`Guardaste ${lista.length} balas nuevas`); } }); return; }
  E.ocup = true; render(); const img = $(`#items [data-i="${E.sel}"] .img`); Son.resorte();
  if (E.tab === 'cajas') { await FX.volar(img, $('#pNor'), caja(it.c), { w: 70, arco: -80, estela: false }); Son.metal(); const a = E.nor; E.nor += it.c; FX.flotar($('#pNor'), '+' + it.c + ' balas'); await FX.contar($('#pNor'), a, E.nor, 600, true); }
  else { await FX.volar(img, $('#bComprar'), ficha(it.id, 1), { w: 70, arco: -60, color: rcol(it.id) }); Son.metal(); E.vendidas.add(it.id); FX.estallido($('#bComprar'), rcol(it.id), 14, RORD[rareza(it.id)] >= 2); if (RORD[rareza(it.id)] >= 2) Son.campana(); FX.toast(`Compraste ${nombre(it.id)}: va a tu cinturón`); }
  E.ocup = false; render();
};
$('#bReiniciar').onclick = () => { nuevo(); $('#pOro').textContent = E.oro; $('#pNor').textContent = 0; Son.clic(); render(); FX.toast('Todo vuelve al inicio'); };
render();
</script></body></html>
