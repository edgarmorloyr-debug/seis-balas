<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 5 · Tablero de fichas</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css"><script src="fichas.js"></script><script src="vivo.js"></script>
<style>
.lay{flex:1;min-height:0;display:flex;gap:calc(var(--gap)*1.5)}
.board{position:relative;display:grid;grid-template-columns:repeat(6,calc(var(--ch) + 14px));grid-template-rows:auto repeat(2,calc(var(--ch) + 14px)) auto calc(var(--ch) + 14px);gap:6px;padding:10px;border-radius:14px;background:#0a1a12;border:3px solid var(--wood);box-shadow:inset 0 0 20px #000a;align-content:center}
.board .lbl{align-self:end}
.tile{border-radius:12px;background:#ffffff0d;border:1px solid #ffffff1a;display:flex;align-items:center;justify-content:center;position:relative}
.tile.belt{background:linear-gradient(#7a4822,#4a2a12);border:1px solid #e0b07a55}
.pocket{grid-column:5/7;grid-row:2/4;background:linear-gradient(#3d2a1a,#24170c);border:1px dashed #e0b07a88;flex-direction:column;gap:4px}
.pocket .st{display:flex}.pocket .st .f{margin-right:calc(var(--ch)*-.6)}.pocket .st .f:last-child{margin-right:0}
.pocket .txt{font-size:16px;text-align:center}
.side{flex:1;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.steps{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;margin:4px 0}
.steps .f{--ch:clamp(34px,7.6vh,58px)}
.steps .ar{color:var(--bone-dim);font-size:16px}
.steps .f.dim{opacity:.35;filter:grayscale(.6)}
.side .btn.main{margin-top:auto}
.row2{display:flex;gap:8px}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px}.top h1{flex-basis:100%;order:-1}.top .lbl{display:none}
  :root{--ch:clamp(30px,calc((100vw - 140px)/6),60px)}
  .board{grid-template-columns:repeat(6,calc(var(--ch) + 8px));grid-template-rows:auto repeat(2,calc(var(--ch) + 8px)) auto calc(var(--ch) + 8px);padding:8px}
  .lay{flex-direction:column}
  .board{align-self:center}
  .steps .f{--ch:clamp(34px,10vw,52px)}
  .side .pc-only{display:block!important}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Tablero de fichas</h1><span class="lbl">Arrastra una ficha sobre su gemela</span><span class="sp"></span><span id="pills"></span><button class="btn" id="bReiniciar">Reiniciar</button></div>
<div class="lay">
 <div class="board" id="board"></div>
 <div class="side">
  <div class="panel" id="esc"></div>
  <div class="panel pc-only"><div class="lbl" style="margin-bottom:6px">Parejas en el tablero</div><div class="txt" id="par"></div></div>
  <div class="row2"><button class="btn" id="bOrdenar">Ordenar</button></div>
  <button class="btn main" id="bListo">Listo</button>
 </div>
</div></div>
<script>
let foco = 'cin:1', sel = null, ocupado = false;
const mesa = document.querySelector('.frame');
function render() {
  if (sel && !Z.get(sel)) sel = null; if (!Z.get(foco)) foco = Z.llenas()[0];
  $('#pills').innerHTML = pastillas();
  const b = Z.e.bol;
  $('#board').innerHTML = `<div class="lbl" style="grid-column:1/5">Cinturón <b>${cuenta('cin')}</b></div><div class="lbl" style="grid-column:5/7">Bolsillo <b>${b ? b.nv : 0}/5</b></div>`
    + Z.e.cin.slice(0, 4).map((_, i) => hueco('cin:' + i, 'tile belt')).join('')
    + `<div class="tile pocket${b ? '' : ' vacio'}" data-loc="bol">${b ? `<span class="st">${Array.from({ length: b.nv }, (_, i) => ficha(b.id, i === b.nv - 1 ? b.nv : 0, { pair: i === b.nv - 1 && Z.pareja('bol') })).join('')}</span><span class="txt">×${b.nv} · +${b.nv * 20} %</span>` : '<span class="txt">Apila copias</span>'}</div>`
    + Z.e.cin.slice(4).map((_, i) => hueco('cin:' + (i + 4), 'tile belt')).join('')
    + `<div class="lbl" style="grid-column:1/7">Inventario <b>${cuenta('inv')}</b> · sin efecto</div>`
    + Z.e.inv.map((_, i) => hueco('inv:' + i, 'tile')).join('');
  if (sel) locEl(sel)?.classList.add('elegida');
  const it = Z.get(foco);
  if (it) {
    const id = it.id, nv = it.nv;
    $('#esc').innerHTML = `<div class="lbl">Escalera de ${nombre(id)}</div><div class="steps">${[1, 2, 3, 4, 5].map(n => ficha(id, n, { cls: n > nv ? 'dim' : n === nv ? 'glow' : '', style: `--gc:${brillo(id)}` })).join('<span class="ar">&gt;</span>')}</div>
      <div class="txt">Nv ${nv}: ${queHace(id, nv)}<br><small>${nv >= 5 ? 'Nivel máximo' : `Para Nv ${nv + 1} suma 1 copia más · juntar cuesta 1 ficha`}</small></div>`;
  }
  const ps = Z.parejas();
  $('#par').innerHTML = ps.length ? ps.slice(0, 3).map(p => { const A = Z.get(p.a), B = Z.get(p.b); return p.r.tipo === 'fusion' && !Z.conocida(p.r.id) ? `${nombre(A.id)} + ${nombre(B.id)} = ?` : `${nombre(A.id)} + ${nombre(B.id)} = ${nombre(p.r.id)} Nv ${p.r.nv}`; }).join('<br>') + '<br><small>Las fichas con flecha verde tienen gemela</small>' : 'No hay parejas ahora';
}
async function juntar(a, b) {
  const A = Z.get(a), antes = foto();
  const r0 = Z.combinar(A, Z.get(b)); if (r0.err) { FX.toast(r0.err, true); return; }
  if (Z.e.fichas < 1) { FX.toast('No te quedan fichas. Toca «Reiniciar».', true); return; }
  ocupado = true;
  const r = Z.juntar(a, b); sel = null; foco = b; render(); contarPastillas(antes);
  const el = fichaEl(b); el.animate([{ transform: 'scale(.6)' }, { transform: 'scale(1.55)', offset: .45 }, { transform: 'scale(.9)', offset: .75 }, { transform: 'scale(1)' }], { duration: 560, easing: 'ease-out' });
  await celebrar(el, r); ocupado = false;
}
arrastre(mesa, {
  puede: () => !ocupado,
  alPasar(a, b) {
    const A = Z.get(a), B = Z.get(b);
    if (b === 'bol') return B && B.id === A.id ? 'Apilar ×' + (A.nv + B.nv) : B ? '' : 'Guardar';
    if (!B) return 'Mover';
    const r = Z.combinar(A, B); if (r.err) return 'Cambiar';
    return r.tipo === 'fusion' ? (Z.conocida(r.id) ? nombre(r.id) : 'Fusión ?') : 'Nv ' + r.nv;
  },
  alSoltar(a, b) {
    if (ocupado || b.startsWith('drop:')) return;
    const A = Z.get(a), B = Z.get(b);
    if (B && b !== 'bol' && !Z.combinar(A, B).err) return juntar(a, b);
    const r = Z.mover(a, b); if (r.err) { if (r.err) FX.toast(r.err, true); return; }
    foco = b === 'bol' ? 'bol' : b; render(); FX.rebote(fichaEl(b), 1.2);
    if (r.ok === 'apilar') { Son.pop(r.item.nv); FX.flotar(fichaEl(b), 'Bolsillo ×' + r.item.nv + ' · +' + r.item.nv * 20 + ' %', '#e86fae'); } else Son.clic();
  },
  alTocar(k) {
    if (ocupado || !Z.get(k)) return;
    if (sel && sel !== k && !Z.combinar(Z.get(sel), Z.get(k)).err) return juntar(sel, k);
    sel = sel === k ? null : k; foco = k; Son.clic(); render(); FX.rebote(fichaEl(k), 1.15);
  },
});
$('#bOrdenar').onclick = () => {
  const xs = Z.e.inv.filter(Boolean).sort((a, b) => RORD[rareza(b.id)] - RORD[rareza(a.id)] || a.id.localeCompare(b.id) || b.nv - a.nv);
  Z.e.inv = [...xs, ...Array(6 - xs.length).fill(null)]; sel = null; render(); Son.ficha(); $$('#board .tile:not(.belt):not(.pocket) .f').forEach((f, i) => setTimeout(() => FX.rebote(f, 1.2), i * 60)); FX.toast('Inventario ordenado por rareza');
};
$('#bListo').onclick = () => {
  const xs = Z.e.cin.filter(Boolean), tot = xs.reduce((s, x) => s + x.nv, 0);
  Son.campana(); $$('#board .tile.belt .f').forEach((f, i) => setTimeout(() => { FX.rebote(f, 1.25); Son.tic(800 + i * 120, .05); }, i * 80));
  FX.toast(`Cinturón listo: ${xs.length} balas, ${tot} niveles en total`);
};
botonReiniciar(() => { sel = null; foco = 'cin:1'; render(); });
render();
</script></body></html>
