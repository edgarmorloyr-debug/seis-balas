<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 3 · Tragamonedas de fusión</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css"><script src="fichas.js"></script><script src="vivo.js"></script>
<style>
.mach{flex:1;min-height:0;display:flex;gap:var(--gap)}
.cab{flex:1.5;position:relative;border-radius:18px;background:linear-gradient(#7b1d14,#4a0f0a);border:3px solid var(--brass);box-shadow:inset 0 0 0 4px #2a0805,0 6px 20px #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 64px 6px 14px;gap:4px;min-height:0;--rc:clamp(44px,13vh,96px)}
.marq{display:flex;align-items:center;gap:8px;font:400 clamp(16px,3.6vh,30px) var(--display);color:var(--gold);text-shadow:0 0 10px #ff9a2a}
.bulbs{display:flex;gap:6px}.bulbs i{width:9px;height:9px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px #ffcf5a;animation:glow .6s infinite alternate}.bulbs i:nth-child(2n){animation-delay:.3s;background:#ff7a3a}
.cab.loca .bulbs i{animation-duration:.15s}
.reels{display:flex;align-items:center;gap:8px;flex:1;min-height:0;max-height:calc(var(--rc)*2.1)}
.reel{position:relative;width:calc(var(--rc)*1.35);height:100%;min-height:calc(var(--rc)*1.15);border-radius:10px;background:linear-gradient(#ddd,#fff 30%,#fff 70%,#ccc);box-shadow:inset 0 0 0 3px #222,inset 0 10px 14px #0006,inset 0 -10px 14px #0006;overflow:hidden;display:flex;align-items:center;justify-content:center;--ch:var(--rc)}
.reel .vac{font-size:14px;color:#555;text-align:center;padding:4px}
.reel .q{font:400 calc(var(--rc)*.6) var(--display);color:#7d3bb3}
.reel .no{font:700 16px var(--hud);color:#b01e10;text-align:center}
.reel .prev{opacity:.45}
.reel.win{box-shadow:inset 0 0 0 3px #222,0 0 0 4px var(--gold),0 0 22px var(--gold)}
.tira{position:absolute;left:0;right:0;top:0;display:flex;flex-direction:column;align-items:center;gap:8px;animation:rodar3 .16s linear infinite;filter:blur(1.5px)}
@keyframes rodar3{from{transform:translateY(0)}to{transform:translateY(calc(var(--rc)*-1 - 8px))}}
.op{font:400 clamp(22px,5vh,40px) var(--display);color:var(--gold)}
.lever{position:absolute;right:8px;top:12%;bottom:12%;width:48px;cursor:pointer;touch-action:none}
.lever .bar{position:absolute;left:20px;top:22px;bottom:0;width:8px;background:linear-gradient(90deg,#999,#eee,#888);border-radius:4px;transform-origin:bottom}
.lever .knob{position:absolute;left:4px;top:0;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b01e10);box-shadow:0 3px 6px #0008}
.info{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:space-between;min-width:0}
.info h2{font:400 clamp(18px,3.6vh,28px) var(--display);color:#6fd3f0}
.tray{display:flex;align-items:flex-end;gap:10px;padding:6px 10px;border-radius:12px;--ch:clamp(38px,9.5vh,60px)}
.grp{display:flex;flex-direction:column;gap:3px}.grp .chips{display:flex;gap:4px;align-items:center}
.tray .slot{width:calc(var(--ch) + 2px);height:calc(var(--ch) + 2px)}
.pila{display:flex;align-items:center;min-width:var(--ch);min-height:var(--ch);border-radius:50%}.pila .f{margin-right:calc(var(--ch)*-.7)}.pila .f:last-child{margin-right:0}
.sep{width:2px;align-self:stretch;background:#e0b07a66}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px}.top h1{flex-basis:100%;order:-1}
  .mach{flex-direction:column}
  .cab{flex:none;padding:10px 60px 10px 10px;--rc:clamp(44px,13.5vw,64px)}
  .reels{flex:none;height:calc(var(--rc)*1.7)}
  .info{flex:1}
  .ladder.pc-only{display:grid!important}
  .tray{flex-wrap:wrap;justify-content:center;--ch:clamp(38px,10vw,48px)}
  .sep{display:none}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="index.html">Menú</a><h1>Fusión de la casa</h1><span class="sp"></span><span id="pills"></span><button class="btn" id="bReiniciar">Reiniciar</button></div>
<div class="mach">
 <div class="cab" id="cab">
  <div class="marq"><span class="bulbs"><i></i><i></i><i></i></span>FUSIÓN<span class="bulbs"><i></i><i></i><i></i></span></div>
  <div class="reels"><div class="reel" id="r0" data-drop="r0"></div><span class="op">+</span><div class="reel" id="r1" data-drop="r1"></div><span class="op">=</span><div class="reel" id="r2"></div></div>
  <div class="lever" id="lever"><div class="bar"></div><div class="knob"></div></div>
 </div>
 <div class="info panel">
  <div><h2 id="h"></h2><div class="txt" id="d"></div></div>
  <div class="pc-only" id="lad"></div>
  <div class="txt"><small id="sub"></small></div>
  <button class="btn main" id="bTirar">Tirar de la palanca · 1 ficha</button>
 </div>
</div>
<div class="tray leather" id="tray">
 <div class="grp"><div class="lbl">Cinturón <b id="cCin"></b></div><div class="chips" id="cin"></div></div>
 <span class="sep"></span>
 <div class="grp"><div class="lbl">Bolsillo</div><div class="chips"><span id="bol"></span><span class="txt" id="tBol"></span></div></div>
 <span class="sep"></span>
 <div class="grp"><div class="lbl">Inventario <b id="cInv"></b></div><div class="chips" id="inv"></div></div>
</div>
</div>
<script>
let rod = [null, null], mostrar = null, girando = false;
const mesa = document.querySelector('.frame');
function orden() { const [a, b] = rod; if (a === 'bol') return [a, b]; if (b === 'bol') return [b, a]; if (a.startsWith('cin') && !b.startsWith('cin')) return [b, a]; return [a, b]; }
function render() {
  rod = rod.map(l => l && Z.get(l) ? l : null);
  $('#pills').innerHTML = pastillas();
  $('#cin').innerHTML = Z.e.cin.map((_, i) => hueco('cin:' + i)).join('');
  $('#inv').innerHTML = Z.e.inv.map((_, i) => hueco('inv:' + i)).join('');
  $('#bol').innerHTML = bolsilloHTML(); $('#tBol').textContent = Z.e.bol ? '×' + Z.e.bol.nv : '';
  $('#cCin').textContent = cuenta('cin'); $('#cInv').textContent = cuenta('inv');
  rod.forEach(l => l && locEl(l)?.classList.add('usada', 'elegida'));
  if (girando) return;
  [0, 1].forEach(i => { const x = rod[i] && Z.get(rod[i]); $('#r' + i).innerHTML = x ? ficha(x.id, x.nv) : `<span class="vac">Toca una bala</span>`; $('#r' + i).classList.toggle('win', !!x); });
  let h = 'Elige 2 balas', d = 'Iguales suben de nivel. Distintas pueden dar una fusión.', lad = '', sub = 'Toca 2 balas de abajo o arrástralas a los rodillos', ok = false, r2 = '<span class="q">?</span>';
  if (mostrar) { r2 = ficha(mostrar.id, mostrar.nv); h = `${nombre(mostrar.id)} · ${rareza(mostrar.id)}`; d = queHace(mostrar.id, mostrar.nv); lad = escalera(mostrar.id, mostrar.nv); }
  else if (rod[0] && rod[1]) {
    const [s, t] = orden(), r = Z.combinar(Z.get(s), Z.get(t)); ok = true;
    if (r.err) { h = 'Prueba suerte'; d = 'Esta pareja no está en el libro de fusiones'; sub = 'Si no se juntan, no pierdes nada'; }
    else if (r.tipo === 'fusion' && !Z.conocida(r.id)) { h = 'Fusión nueva'; d = 'La primera vez sale un «?». Tira para descubrirla.'; }
    else { r2 = `<span class="prev">${ficha(r.id, r.nv)}</span>`; h = `${nombre(r.id)} · ${rareza(r.id)}`; d = queHace(r.id, r.nv); lad = escalera(r.id, r.nv); const f = FUS[r.id]; sub = f ? `Sube de nivel con 1 ${nombre(f[0])} o 1 ${nombre(f[1])}` : `Nv ${r.nv}: ${r.nv >= 5 ? 'nivel máximo' : 'sigue sumando copias'}`; }
  } else if (rod[0] || rod[1]) { const x = Z.get(rod[0] || rod[1]); h = `${nombre(x.id)} · Nv ${x.nv}`; d = queHace(x.id, x.nv); lad = escalera(x.id, x.nv); sub = 'Falta la segunda bala'; }
  $('#r2').innerHTML = r2; $('#r2').classList.toggle('win', !!mostrar);
  $('#h').textContent = h; $('#h').style.color = mostrar ? brillo(mostrar.id) : '#6fd3f0'; $('#d').textContent = d; $('#lad').innerHTML = lad; $('#sub').textContent = sub;
  $('#bTirar').disabled = !ok || !!mostrar;
}
function poner(l, i) {
  if (girando || mostrar) return;
  if (rod.includes(l)) { rod[rod.indexOf(l)] = null; Son.clic(); render(); return; }
  if (i == null) i = rod[0] ? (rod[1] ? 1 : 1) : 0; rod[i] = l; Son.ficha(); render(); FX.rebote($('#r' + i + ' .f'), 1.2);
}
arrastre(mesa, {
  puede: () => !girando,
  alTocar(k) { if (k === 'drop:r0' || k === 'drop:r1') { const i = +k.slice(-1); if (rod[i] && !girando && !mostrar) { rod[i] = null; Son.clic(); render(); } return; } if (Z.get(k)) poner(k); },
  alPasar(a, b) { if (b.startsWith('drop:r')) return 'Al rodillo'; if (b === 'bol') return Z.e.bol && Z.e.bol.id === Z.get(a).id ? 'Apilar' : Z.e.bol ? '' : 'Guardar'; return Z.get(b) ? 'Cambiar' : 'Mover'; },
  alSoltar(a, b) {
    if (b.startsWith('drop:r')) { const i = +b.slice(-1); if (rod[1 - i] === a) rod[1 - i] = null; poner(a, i); return; }
    const r = Z.mover(a, b); if (r.err) { if (r.err) FX.toast(r.err, true); return; }
    rod = rod.map(x => x === a ? b : x === b ? a : x); render(); FX.rebote(fichaEl(b), 1.2); r.ok === 'apilar' ? Son.ficha() : Son.clic();
  },
});
const tira = () => `<div class="tira">${Array.from({ length: 6 }, () => ficha(LISTA40[Math.floor(Math.random() * 40)])).join('')}</div>`;
async function tirar() {
  if (girando || mostrar || !rod[0] || !rod[1]) return;
  const [s, t] = orden(), A = Z.get(s), B = Z.get(t), r = Z.combinar(A, B), antes = foto();
  if (!r.err && Z.e.fichas < 1) { FX.toast('No te quedan fichas. Toca «Reiniciar».', true); return; }
  girando = true; $('#bTirar').disabled = true; Son.palanca();
  $('#lever .knob').animate([{ transform: 'none' }, { transform: 'translateY(120px)', offset: .45 }, { transform: 'none' }], { duration: 650, easing: 'ease-in-out' });
  $('#lever .bar').animate([{ transform: 'scaleY(1)' }, { transform: 'scaleY(.3)', offset: .45 }, { transform: 'scaleY(1)' }], { duration: 650, easing: 'ease-in-out' });
  $('#cab').classList.add('loca'); ['#r0', '#r1', '#r2'].forEach(x => { $(x).innerHTML = tira(); $(x).classList.remove('win'); });
  const tk = setInterval(() => Son.tic(900 + Math.random() * 400, .03), 70);
  const parar = (i, html) => { const e = $('#r' + i); e.innerHTML = html; e.classList.add('win'); e.firstChild?.animate?.([{ transform: 'translateY(-60%)' }, { transform: 'translateY(12%)', offset: .7 }, { transform: 'none' }], { duration: 260, easing: 'ease-out' }); Son.clac(); };
  await espera(800); parar(0, ficha(A.id, A.nv)); await espera(600); parar(1, ficha(B.id, B.nv)); await espera(900);
  clearInterval(tk);
  if (r.err) { parar(2, '<span class="no">No se<br>juntan</span>'); $('#r2').classList.remove('win'); Son.error(); FX.toast(r.err + '. No perdiste nada.'); $('#cab').classList.remove('loca'); await espera(900); girando = false; render(); return; }
  const res = Z.juntar(s, t); rod = [null, null]; mostrar = res.item; parar(2, ficha(res.item.id, res.item.nv)); contarPastillas(antes);
  if (RORD[rareza(res.item.id)] >= 2 || res.item.nv >= 5) Son.jackpot();
  girando = false; render(); celebrar($('#r2'), res);
  await espera(1500); $('#cab').classList.remove('loca');
  const de = $('#r2 .f'); mostrar = null; girando = true; render();
  await FX.volar(de, fichaEl(t), ficha(res.item.id, res.item.nv), { color: brillo(res.item.id) });
  girando = false; render(); const el = fichaEl(t); Son.ficha(); FX.rebote(el, 1.3); FX.estallido(el, brillo(res.item.id), 10);
}
$('#bTirar').onclick = tirar;
$('#lever').addEventListener('click', tirar);
botonReiniciar(() => { rod = [null, null]; mostrar = null; render(); });
render();
</script></body></html>
