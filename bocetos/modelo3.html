<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Modelo 3 · Tragamonedas de fusión</title><link rel="stylesheet" href="base.css"><script src="fichas.js"></script>
<style>
.mach{flex:1;min-height:0;display:flex;gap:var(--gap)}
.cab{flex:1.5;position:relative;border-radius:18px;background:linear-gradient(#7b1d14,#4a0f0a);border:3px solid var(--brass);box-shadow:inset 0 0 0 4px #2a0805,0 6px 20px #0009;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 64px 6px 14px;gap:4px}
.marq{display:flex;align-items:center;gap:8px;font:400 clamp(16px,3.6vh,30px) var(--display);color:var(--gold);text-shadow:0 0 10px #ff9a2a}
.bulbs{display:flex;gap:6px}.bulbs i{width:9px;height:9px;border-radius:50%;background:#ffe9a8;box-shadow:0 0 8px #ffcf5a;animation:glow .6s infinite alternate}.bulbs i:nth-child(2n){animation-delay:.3s;background:#ff7a3a}
.cab{--ch:clamp(44px,13vh,110px)}.reels{display:flex;align-items:center;gap:8px;flex:1;max-height:calc(var(--ch)*2.3)}
.reel{position:relative;width:calc(var(--ch)*1.45);height:100%;border-radius:10px;background:linear-gradient(#ddd,#fff 30%,#fff 70%,#ccc);box-shadow:inset 0 0 0 3px #222,inset 0 10px 14px #0006,inset 0 -10px 14px #0006;overflow:hidden;display:flex;align-items:center;justify-content:center}
.reel .ghost{position:absolute;left:50%;transform:translateX(-50%);opacity:.35;filter:blur(1px)}
.reel .ghost.t{top:calc(var(--ch)*-.6)}.reel .ghost.b{bottom:calc(var(--ch)*-.6)}
.reel.spin .blur{position:absolute;inset:0;background:repeating-linear-gradient(#fff0 0 18px,#6fd3f055 18px 30px);animation:roll .25s linear infinite}
@keyframes roll{to{background-position:0 30px}}
.reel.win{box-shadow:inset 0 0 0 3px #222,0 0 0 4px var(--gold),0 0 22px var(--gold)}
.op{font:400 clamp(22px,5vh,40px) var(--display);color:var(--gold)}
.lever{position:absolute;right:12px;top:16%;bottom:16%;width:40px}
.lever .bar{position:absolute;left:16px;top:22px;bottom:0;width:8px;background:linear-gradient(90deg,#999,#eee,#888);border-radius:4px}
.lever .knob{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff8a7a,#b01e10);box-shadow:0 3px 6px #0008}
.info{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:space-between}
.info h2{font:400 clamp(18px,3.6vh,28px) var(--display);color:#6fd3f0}
.tray{display:flex;align-items:flex-end;gap:10px;padding:6px 10px;border-radius:12px}
.grp{display:flex;flex-direction:column;gap:3px}.grp .chips{display:flex;gap:4px}
.tray .f,.tray .slot{--ch:clamp(40px,9.5vh,64px)}
.tray .slot{width:var(--ch);height:var(--ch)}
.sep{width:2px;align-self:stretch;background:#e0b07a66}
.picked{outline:3px solid var(--gold);outline-offset:2px;border-radius:50%;opacity:.45}
</style></head><body><div class="frame">
<div class="top"><h1>Fusión de la casa</h1><span class="sp"></span><span class="pill"><i></i>340</span><span class="pill"><i class="red"></i>3</span><button class="btn">Cerrar</button></div>
<div class="mach">
 <div class="cab">
  <div class="marq"><span class="bulbs"><i></i><i></i><i></i></span>FUSIÓN<span class="bulbs"><i></i><i></i><i></i></span></div>
  <div class="reels">
   <div class="reel win"><x-f b="rayo" cls="ghost t"></x-f><x-f b="escarcha" nv="2"></x-f><x-f b="oro" cls="ghost b"></x-f></div>
   <span class="op">+</span>
   <div class="reel win"><x-f b="escarcha" cls="ghost t"></x-f><x-f b="rayo" nv="1"></x-f><x-f b="frita" cls="ghost b"></x-f></div>
   <span class="op">=</span>
   <div class="reel spin"><div class="blur"></div><x-f b="ventisca" nv="1" cls="glow" style="--gc:#6fd3f0;filter:blur(1.5px)"></x-f></div>
  </div>
  <div class="lever"><div class="bar"></div><div class="knob"></div></div>
 </div>
 <div class="info panel">
  <div><h2>Ventisca · A</h2><div class="txt">Tormenta de hielo: congela y aturde en 4 m por 3 s.</div></div>
  <div class="ladder pc-only"><b class="on">Nv 1</b><span>4 m · 3 s</span><span>Nv 2</span><span>5 m · 3,5 s</span><span>Nv 3</span><span>6 m · 4 s</span><span>Nv 4</span><span>7 m · 4,5 s</span><span>Nv 5</span><span>8 m · 5 s · cada congelado suelta un rayo</span></div>
  <div class="txt"><small>Sube de nivel con 1 Escarcha o 1 Relámpago</small></div>
  <button class="btn main">Tirar de la palanca · 1 ficha</button>
 </div>
</div>
<div class="tray leather">
 <div class="grp"><div class="lbl">Cinturón <b>7/8</b></div><div class="chips"><x-f b="polvora" nv="3"></x-f><x-f b="escarcha" nv="2" cls="picked"></x-f><x-f b="negra" nv="1"></x-f><x-f b="oro" nv="2"></x-f><x-f b="ruleta" nv="1"></x-f><x-f b="robot" nv="1"></x-f><x-f b="vampira" nv="2"></x-f><span class="slot"></span></div></div>
 <span class="sep"></span>
 <div class="grp"><div class="lbl">Bolsillo</div><div class="chips"><x-f b="chicle" nv="1"></x-f><span class="txt">x3</span></div></div>
 <span class="sep"></span>
 <div class="grp"><div class="lbl">Inventario <b>5/6</b></div><div class="chips"><x-f b="rayo" nv="1" cls="picked"></x-f><x-f b="frita" nv="1"></x-f><x-f b="taladro" nv="1"></x-f><x-f b="oro" nv="1"></x-f><x-f b="escarcha" nv="1"></x-f><span class="slot"></span></div></div>
</div>
</div></body></html>
