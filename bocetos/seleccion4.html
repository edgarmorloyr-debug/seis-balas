<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selección 4 · Expediente engrapado</title>
<link rel="stylesheet" href="seleccion.css">
<style>
/* Propuesta 4 · Expediente engrapado: la ficha del personaje es una hoja escrita a máquina, engrapada dentro de una carpeta,
   con la foto sujeta por un clip. Si está bloqueado, una nota amarilla pegada dice cómo abrirlo.
   Al cambiar: la hoja entra, la foto cae desde arriba y el clip la sujeta. */
body{background:radial-gradient(100% 80% at 50% 30%,#3d4a3a,#1f281e 70%,#141a13)}
.carpeta{position:relative;width:100%;padding:16px 14px 14px;margin-top:18px;border-radius:4px 12px 12px 12px;background:linear-gradient(#e2bd76,#c99a4e);box-shadow:0 14px 30px #000b}
.carpeta::before{content:"Expediente";position:absolute;left:0;top:-30px;height:32px;padding:0 22px;border-radius:10px 10px 0 0;background:#e2bd76;color:#4a3210;font:700 15px/32px var(--hud);letter-spacing:2px;text-transform:uppercase}
.hoja{position:relative;background:repeating-linear-gradient(#0000 0 27px,#9ab8d433 27px 28px),#fbf7ec;color:#1d160e;padding:14px 16px;border-radius:2px;box-shadow:0 2px 6px #0004;transform:rotate(-.4deg)}
.grapa{position:absolute;width:22px;height:4px;background:linear-gradient(#ddd,#888);border-radius:2px;box-shadow:0 1px 1px #0006;z-index:2}
.grapa.a{left:10px;top:12px;transform:rotate(-40deg)}.grapa.b{right:10px;top:12px;transform:rotate(40deg)}
.pp{max-height:none}
.foto{border:8px solid #fff;border-bottom-width:24px;box-shadow:0 4px 10px #0006;transform:rotate(-3deg);background:#fff;margin:6px 0 0 6px}
.clip{grid-area:foto;align-self:start;justify-self:center;width:26px;height:60px;margin-top:-14px;position:relative;z-index:3;pointer-events:none}
.clip svg{width:100%;height:100%;fill:none;stroke:#8f979e;stroke-width:3;filter:drop-shadow(0 1px 1px #0008)}
.tit{display:flex;justify-content:space-between;gap:8px;font:700 15px var(--mono);color:#5a4a36;text-transform:uppercase;letter-spacing:1px}
.nombre{font-family:var(--mono)!important;font-weight:700!important;letter-spacing:1px;color:#1d160e;text-decoration:underline 2px #1d160e55;text-underline-offset:5px}
.campos dt{color:#5a4a36;font-family:var(--mono);text-transform:none;letter-spacing:0;font-size:15px}
.campos dt::after{content:":"}
.campos dd{color:#1d160e}
.jefes{color:#b3122a}
/* nota amarilla pegada con el requisito */
.req{background:#ffe066;color:#3a2a00;padding:8px 12px;transform:rotate(-2deg);box-shadow:0 4px 8px #0004;align-self:flex-start;margin-top:4px;font-size:16px}
.req svg{fill:#7a5a00}
.cel{border:2px solid #1d160e;background:#fffdf5;border-radius:2px}
.cel h3{font-family:var(--mono);font-size:16px;text-transform:uppercase}
.cel h3 small{font-family:var(--hud)}
.cel.pas h3{color:#0f5a52}.cel.ult h3{color:#8a2a00}
.est div{border:2px solid #1d160e;background:#fffdf5;border-radius:2px}
.est b{font-family:var(--mono);font-size:20px}
.est small{color:#4a3a28}
.sello{grid-area:foto;align-self:start;justify-self:center;position:relative;margin-top:calc(clamp(150px,36vh,260px) * .55);z-index:3;color:#b3122a;border:4px double #b3122a;border-radius:6px;padding:4px 10px;font:400 20px/1.05 var(--display);text-transform:uppercase;text-align:center;transform:rotate(-8deg);background:#fbf7ece6;pointer-events:none}
.pp .foto .candado{display:none}
.cambia .hoja{animation:hoja .4s ease-out}
.cambia .foto{animation:cae .5s .15s cubic-bezier(.3,1.5,.5,1) both}
.cambia .clip{animation:clip .25s .55s ease-out both}
.cambia .req{animation:nota .4s .5s ease-out both}
.cambia .sello{animation:sella .35s .4s ease-out both}
@keyframes hoja{from{transform:translateX(40px) rotate(2deg);opacity:0}to{transform:rotate(-.4deg);opacity:1}}
.cambia.izq .hoja{animation-name:hojaI}
@keyframes hojaI{from{transform:translateX(-40px) rotate(-2deg);opacity:0}to{transform:rotate(-.4deg);opacity:1}}
@keyframes cae{from{transform:translateY(-60px) rotate(-12deg);opacity:0}to{transform:rotate(-3deg);opacity:1}}
@keyframes clip{0%{transform:translateY(-16px) scaleY(1.3);opacity:0}100%{transform:none;opacity:1}}
@keyframes nota{from{transform:rotate(6deg) scale(.6);opacity:0}to{transform:rotate(-2deg);opacity:1}}
@keyframes sella{from{transform:rotate(-8deg) scale(2);opacity:0}to{transform:rotate(-8deg);opacity:1}}
.mini img{border:3px solid #fff;border-bottom-width:9px;border-radius:1px;background:#fff}
.mini.on img{border-color:var(--gold)}
@media (orientation:landscape) and (max-height:520px){
  .carpeta{height:calc(100% - 14px);margin-top:14px;padding:8px}
  .carpeta::before{top:-22px;height:24px;line-height:24px;font-size:14px;padding:0 14px}
  .hoja{height:100%;padding:8px 12px}
  .foto{margin:4px 0 0 4px;border-width:6px;border-bottom-width:16px;width:170px}
  .tit{display:none}
  .req{padding:4px 10px;margin-top:0;font-size:15px}
  .sello{font-size:17px;align-self:end;margin:0 0 22%}
}
@media (orientation:portrait){
  .carpeta{padding:10px 8px 8px}
  .hoja{padding:10px}
  .foto{height:140px;border-width:6px;border-bottom-width:16px}
  .tit{font-size:14px;letter-spacing:0}
  .req{font-size:15px;padding:6px 8px}
  .sello{font-size:15px;padding:3px 6px;margin-top:70px}
  .est b{font-size:17px}
  .tit{justify-content:flex-end}.tit span:first-child{display:none}
}
</style></head><body>
<main class="pg">
  <header class="top"><h1>Elige tu personaje</h1></header>
  <section id="doc" aria-live="polite"></section>
  <div class="bar"><button class="btn" id="volver">Volver</button><nav id="fila" aria-label="Personajes"></nav><button class="btn main" id="elegir">Elegir</button></div>
</main>
<script>
const CLIP = '<svg viewBox="0 0 26 60" aria-hidden="true"><path d="M8 40V10a5 5 0 0 1 10 0v38a8 8 0 0 1-16 0V16"/></svg>';
window.SEL = {
  pinta: c => { const H = SELH; return `<div class="carpeta"><div class="hoja"><i class="grapa a"></i><i class="grapa b"></i><div class="pp">
    ${H.foto(c)}<i class="clip">${CLIP}</i>
    <div class="cab"><div class="tit"><span>Ficha del pistolero</span><span>Nº ${c.num}</span></div>
      <div class="nombre">${c.name}</div>
      <dl class="campos"><dt>Arma</dt><dd>${H.arma(c)}</dd><dt>Vida</dt><dd>${c.vida}</dd>${c.jefes == null ? '' : `<dt>Jefes del casino</dt><dd>${H.jefes(c)}</dd>`}</dl>
      ${H.req(c)}</div>
    ${H.hab(c)}${H.est(c)}${c.open ? '' : '<div class="sello" aria-hidden="true">Archivo<br>cerrado</div>'}
  </div>${c.open ? '' : ''}</div></div>`; }
};
</script>
<script src="seleccion.js"></script>
</body></html>
