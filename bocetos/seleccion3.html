<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selección 3 · Tira de fotomatón</title>
<link rel="stylesheet" href="seleccion.css">
<style>
/* Propuesta 3 · Tira de fotomatón: la cabina de fotos del saloon (cortina roja y focos). A la izquierda sale la tira con
   tres fotos del personaje y a la derecha su boleto con los datos. Al cambiar: destello de flash y las fotos se revelan una a una. */
body{background:
  radial-gradient(60% 50% at 50% 0%,#ffcf8a22,transparent 70%),
  repeating-linear-gradient(90deg,#0000 0 26px,#00000055 26px 30px,#ffffff10 30px 34px,#0000 34px 56px),
  linear-gradient(#7a1020,#4a0812 70%,#2a0408)}
.top h1{color:#ffe6a8;text-shadow:0 0 10px #ffb03a88,0 2px 0 #0009}
.top{position:relative}
.focos{position:absolute;inset:auto 0 -6px 0;height:10px;display:flex;justify-content:space-around;pointer-events:none}
.focos i{width:10px;height:10px;border-radius:50%;background:#ffe9a0;box-shadow:0 0 8px #ffcf6a}
.cabina{position:relative;width:100%;height:100%;max-height:410px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:stretch}
/* la tira de 3 fotos */
.tiras{position:relative;background:#f4f1ea;padding:8px 8px 22px;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:8px;box-shadow:0 10px 24px #000a;transform:rotate(-1.5deg);height:100%;aspect-ratio:1/3;max-width:200px;min-height:0;overflow:hidden}
.tiras .fr{position:relative;overflow:hidden;background:#111}
.tiras img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.15)}
.tiras .fr:nth-child(2) img{transform:scale(1.5) translateY(6%);filter:grayscale(1) contrast(1.25) brightness(1.05)}
.tiras .fr:nth-child(3) img{transform:scaleX(-1);filter:sepia(.7) contrast(1.1)}
.tiras.sombra img{filter:none!important}
.tiras.cerrado img{filter:grayscale(1) brightness(.4)!important}
.tiras .candado{position:absolute;left:50%;top:50%;width:36px;height:36px;transform:translate(-50%,-50%);fill:#fff;filter:drop-shadow(0 2px 3px #000)}
.tiras .pie{position:absolute;left:0;right:0;bottom:3px;text-align:center;font:700 14px var(--mono);color:#3a2c1c}
.tiras.cerrado .pie{color:#b3122a}
/* boleto con los datos */
.boleto{position:relative;background:#fffdf6;color:#1d140c;border-radius:6px;padding:14px 16px;box-shadow:0 10px 24px #000a;min-height:0;display:flex;flex-direction:column;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 7px at 100% 50%,#0000 98%,#000) right/51% 100% no-repeat}
.boleto{justify-content:center}
.boleto .pp{grid-template-columns:minmax(0,1fr);grid-template-areas:"cab" "hab" "est";height:auto}
.cab .tit{display:flex;justify-content:space-between;font:700 14px var(--mono);color:#6a5a48;border-bottom:2px dashed #c9bfae;padding-bottom:4px;letter-spacing:1px;text-transform:uppercase}
.nombre{color:#1d140c}
.campos{grid-template-columns:auto minmax(0,1fr) auto minmax(0,1fr)}
.campos dt{color:#6a5a48}.campos dd{color:#1d140c}
.campos .ancho{grid-column:2/-1}
.jefes{color:#c21a3a}
.req{color:#b3122a}
.cel{border:2px solid #1d140c;border-radius:8px}
.cel.pas h3{color:#0f5a52}.cel.ult h3{color:#8a3a00}
.est div{border-top:3px solid #1d140c;border-bottom:3px solid #1d140c;background:#f4efe2}
.est small{color:#5a4a38}
/* animación: flash y revelado */
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.cambia .flash{animation:flash .45s ease-out}
.cambia .tiras{animation:sale .45s ease-out}
.cambia .tiras .fr img{animation:revela .7s ease-out both}
.cambia .tiras .fr:nth-child(2) img{animation-delay:.18s}
.cambia .tiras .fr:nth-child(3) img{animation-delay:.36s}
.cambia .boleto{animation:imprime .45s .1s ease-out both}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes sale{from{transform:rotate(-1.5deg) translateY(-30px);opacity:0}to{transform:rotate(-1.5deg);opacity:1}}
@keyframes revela{0%{opacity:0;filter:blur(6px) brightness(3) grayscale(1)}100%{opacity:1}}
@keyframes imprime{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
/* fila: película de fotos */
#fila{background:#151515;padding:10px 12px;border-radius:4px;position:relative;
  background-image:repeating-linear-gradient(90deg,#e8e0d0 0 8px,#0000 8px 18px),repeating-linear-gradient(90deg,#e8e0d0 0 8px,#0000 8px 18px);background-size:100% 4px,100% 4px;background-position:0 3px,0 calc(100% - 3px);background-repeat:no-repeat}
.mini img{border-radius:2px;border:2px solid #333}
.mini .nm{color:#e8e0d0}
.mini.on img{border-color:#ffd27a}
@media (orientation:landscape) and (max-height:520px){
  .cabina{max-height:none;gap:10px;padding-left:5px}
  .boleto .pp{flex:1}
  .tiras{max-width:110px;padding:5px 5px 18px;gap:5px}
  .tiras .pie{font-size:14px;bottom:1px}
  .boleto{padding:8px 12px}
  .campos{grid-template-columns:auto minmax(0,1fr) auto auto auto auto}
  .campos dt:first-of-type{grid-column:auto}.campos .ancho{grid-column:auto}
  #fila{padding:6px 8px;background-size:100% 3px,100% 3px;background-position:0 1px,0 calc(100% - 1px)}
  .mini{width:var(--mini)}
}
@media (orientation:portrait){
  .cabina{grid-template-columns:1fr;grid-template-rows:auto auto;max-height:none;height:auto;gap:10px;align-content:center}
  .tiras{aspect-ratio:auto;max-width:none;height:118px;grid-template-rows:none;grid-template-columns:repeat(3,92px);justify-content:center;transform:rotate(-1deg);padding:6px 6px 22px;width:max-content;justify-self:center}
  .cambia .tiras{animation:none}
  .boleto{padding:10px}
  .campos{grid-template-columns:auto minmax(0,1fr);gap:2px 10px}
  .campos dd{margin:0}.campos .ancho{grid-column:2}
  #fila{grid-template-columns:repeat(4,auto);padding:10px 12px}
}
</style></head><body>
<main class="pg">
  <header class="top"><h1>Elige tu personaje</h1><div class="focos" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div></header>
  <section id="doc" aria-live="polite"></section>
  <div class="bar"><button class="btn" id="volver">Volver</button><nav id="fila" aria-label="Personajes"></nav><button class="btn main" id="elegir">Elegir</button></div>
</main>
<script>
window.SEL = {
  pinta: c => { const H = SELH, fr = `<div class="fr"><img alt="" src="${c.foto}"></div>`; return `<div class="flash" aria-hidden="true"></div><div class="cabina">
    <div class="tiras ${c.open ? '' : 'cerrado'} ${c.sombra ? 'sombra' : ''}" role="img" aria-label="Fotos de ${c.name}">${fr}${fr}${fr}${c.open ? '' : `<i class="candado">${H.CANDADO}</i>`}<span class="pie">${c.open ? 'Nº ' + c.num : 'Bloqueado'}</span></div>
    <div class="boleto"><div class="pp">
      <div class="cab"><div class="tit"><span>Boleto de foto</span><span>Nº ${c.num}</span></div>
        <div class="nombre">${c.name}</div>
        <dl class="campos"><dt>Arma</dt><dd class="ancho">${H.arma(c)}</dd><dt>Vida</dt><dd>${c.vida}</dd>${c.jefes == null ? '' : `<dt>Jefes del casino</dt><dd>${H.jefes(c)}</dd>`}</dl>
        ${H.req(c)}</div>
      ${H.hab(c)}${H.est(c)}
    </div></div></div>`; }
};
</script>
<script src="seleccion.js"></script>
</body></html>
