<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Selección 2 · Cédula «Se busca»</title>
<link rel="stylesheet" href="seleccion.css">
<style>
/* Propuesta 2 · Cédula «Se busca»: mitad carné de identidad (esquinas redondas, franja brillante, plastificado) y mitad
   cartel de «Se busca» clavado en la pared del saloon. Al cambiar, la cédula gira como una carta y un brillo la recorre. */
body{background:repeating-linear-gradient(90deg,#00000030 0 2px,transparent 2px 120px),repeating-linear-gradient(0deg,#0000 0 34px,#00000038 34px 37px),linear-gradient(#5a3519,#3a210d)}
.top h1{font-size:clamp(24px,4.4vh,34px)}
#doc{perspective:1400px}
.ced{position:relative;width:100%;border-radius:22px;padding:14px 18px;color:#2b1a0c;
  background:radial-gradient(120% 80% at 20% 10%,#f6e6c2 0%,#e9d3a6 55%,#d9bb84 100%);
  box-shadow:0 14px 34px #000b,inset 0 0 0 2px #fff6,inset 0 0 40px #8a5a2a55}
.ced::before{content:"";position:absolute;inset:0;border-radius:22px;background:linear-gradient(115deg,transparent 30%,#ffffff55 45%,#a0f0ff33 50%,#ffb0f033 55%,transparent 70%);background-size:300% 100%;background-position:120% 0;pointer-events:none}
.clavo{position:absolute;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ddd,#555 60%,#222);box-shadow:0 2px 2px #0008}
.clavo.a{left:10px;top:10px}.clavo.b{right:10px;top:10px}
.pp{max-height:none}
.foto{border:3px solid #2b1a0c;outline:6px solid #f6e6c2;outline-offset:-9px;border-radius:6px;box-shadow:0 0 0 2px #2b1a0c55}
.foto img{filter:sepia(.55) grayscale(.4) contrast(1.15)}
.foto.cerrado img{filter:sepia(.5) grayscale(1) brightness(.45)}
.foto.sombra img{filter:none}
.busca{font:400 clamp(26px,5vh,40px)/1 var(--display);color:#7a1414;letter-spacing:3px;text-transform:uppercase}
.sub{font:700 14px var(--hud);letter-spacing:2px;text-transform:uppercase;color:#5a3a1c;display:flex;gap:10px;flex-wrap:wrap}
.nombre{color:#2b1a0c;border-top:2px solid #2b1a0c;border-bottom:2px solid #2b1a0c;padding:4px 0}
.campos dt{color:#5a3a1c}.campos dd{color:#2b1a0c}
.jefes{color:#7a1414}
.req{color:#fff;background:#7a1414;border-radius:6px;padding:5px 10px;align-self:flex-start}
.cel{background:#fff8e6cc;border-radius:10px;padding:0;border:2px solid #2b1a0c}
.cel h3{background:#2b1a0c;color:#f6e6c2;padding:5px 12px}
.cel h3 small{color:#e9c46a;opacity:1}
.cel.ult h3 small{color:#ffb37a}
.cel p{padding:4px 12px 8px;color:#2b1a0c}
.est div{background:#2b1a0c;border-radius:10px;color:#f6e6c2}
.est small{color:#e9d3a6}
/* banda roja en la esquina si está bloqueado */
.banda{position:absolute;right:-6px;top:22px;z-index:3;background:#b3122a;color:#fff;font:700 18px var(--hud);letter-spacing:3px;text-transform:uppercase;padding:6px 40px;transform:rotate(12deg);box-shadow:0 3px 8px #0007;pointer-events:none}
.cambia .ced{animation:gira .5s cubic-bezier(.3,1.3,.5,1)}
.cambia.izq .ced{animation-name:giraI}
.cambia .ced::before{animation:brillo 1s .35s ease-out}
.cambia .banda{animation:banda .35s .45s ease-out both}
@keyframes gira{from{transform:rotateY(-80deg) scale(.9);opacity:.2}to{transform:none;opacity:1}}
@keyframes giraI{from{transform:rotateY(80deg) scale(.9);opacity:.2}to{transform:none;opacity:1}}
@keyframes brillo{from{background-position:120% 0}to{background-position:-60% 0}}
@keyframes banda{from{transform:rotate(12deg) translateX(60px);opacity:0}to{transform:rotate(12deg);opacity:1}}
/* fila: carteles chiquitos clavados */
.mini img{border-radius:3px;border:3px solid #e9d3a6;filter:sepia(.4)}
.mini.cerrado img{filter:sepia(.4) grayscale(1) brightness(.45)}
.mini::before{content:"";position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#bbb;box-shadow:0 1px 2px #000;z-index:1}
.mini.on img{border-color:var(--gold)}
@media (orientation:landscape) and (max-height:520px){
  .ced{height:100%;padding:8px 12px;border-radius:16px}
  .busca{font-size:24px}.sub{display:none}.nombre{padding:1px 0}
  .banda{font-size:15px;top:14px;padding:4px 30px}
  .cel h3{padding:3px 10px}.cel p{padding:3px 10px 5px}
  .clavo{display:none}
}
@media (orientation:portrait){
  .ced{padding:10px;border-radius:16px}
  .busca{font-size:22px;letter-spacing:1px}
  .sub{gap:2px 8px}
  .foto{height:160px}
  .banda{font-size:14px;padding:4px 26px;top:14px;right:-8px}
  .cel h3{padding:4px 8px}.cel p{padding:3px 8px 6px}
  .clavo{display:none}
}
</style></head><body>
<main class="pg">
  <header class="top"><h1>Elige tu personaje</h1></header>
  <section id="doc" aria-live="polite"></section>
  <div class="bar"><button class="btn" id="volver">Volver</button><nav id="fila" aria-label="Personajes"></nav><button class="btn main" id="elegir">Elegir</button></div>
</main>
<script>
window.SEL = {
  pinta: c => { const H = SELH; return `<div class="ced"><i class="clavo a"></i><i class="clavo b"></i><div class="pp">
    ${H.foto(c)}
    <div class="cab"><div class="busca">Se busca</div><div class="sub"><span>Cédula del Oeste</span><span>Nº ${c.num}</span></div>
      <div class="nombre">${c.name}</div>
      <dl class="campos"><dt>Arma</dt><dd>${H.arma(c)}</dd><dt>Vida</dt><dd>${c.vida}</dd>${c.jefes == null ? '' : `<dt>Jefes del casino</dt><dd>${H.jefes(c)}</dd>`}</dl>
      ${H.req(c)}</div>
    ${H.hab(c)}${H.est(c)}
  </div>${c.open ? '' : '<div class="banda" aria-hidden="true">Bloqueado</div>'}</div>`; }
};
</script>
<script src="seleccion.js"></script>
</body></html>
