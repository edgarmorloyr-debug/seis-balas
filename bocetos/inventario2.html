<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventario 2 · Mano de cartas</title><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="vivo.css"><link rel="stylesheet" href="inventario.css">
<script src="fichas.js"></script><script src="vivo.js"></script><script src="inventario.js"></script>
<style>
/* Diseño 2: como Balatro. Las 8 balas del cinturón son tu MANO de cartas (abajo, en abanico); la reserva es la fila de cartas de arriba.
   A la izquierda, el panel del personaje (en el PC siempre a la vista; en el teléfono, resumido con un botón «Perfil»). */
.lay{flex:1;min-height:0;display:grid;grid-template-columns:var(--izq,250px) 1fr;gap:var(--gap)}
/* ---------- Panel del personaje (izquierda) ---------- */
.pj{min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:14px;background:#1b2a30;border:3px solid #3a5260;box-shadow:inset 0 0 0 2px #0008,0 8px 18px #000a;overflow:hidden}
.pj-hd{display:flex;gap:10px;align-items:center;flex:none}
.pj-hd img{width:clamp(48px,11vh,84px);aspect-ratio:1;border-radius:10px;border:3px solid var(--bone);background:#2a1a0e;transform:rotate(-3deg);box-shadow:0 4px 0 #0008}
.pj-hd div{display:flex;flex-direction:column;min-width:0}
.pj-hd b{font:400 clamp(16px,3vh,22px)/1.05 var(--display);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj-hd span{font-size:14px;color:#b8ccd6}
.bxs{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.bx{border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;min-height:48px;color:#fff;box-shadow:0 3px 0 #0008}
.bx small{font-size:14px;font-weight:700;opacity:.95}.bx b{font-size:clamp(20px,3.4vh,28px);line-height:1;white-space:nowrap}
.bx.rojo{background:#b8392a}.bx.azul{background:#1f62c0}
.bx.on{outline:3px solid #fff;outline-offset:1px}
.minis{display:grid;grid-template-columns:1fr;gap:6px;flex:none}
.mini{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:0 8px;min-height:40px;border-radius:8px;background:#0f1a1f;border:1px solid #3a5260;cursor:pointer}
.mini small{font-size:14px;color:#b8ccd6}.mini b{font-size:16px;white-space:nowrap}
.mini.on{border-color:var(--gold)}
.pj .lbl{color:#b8ccd6}
.pj .objs{display:flex;gap:6px;flex-wrap:wrap;flex:none}
.pj .d{font-size:14px;line-height:1.2;color:var(--bone)}.pj .d b{color:var(--gold)}
.pj .info{flex:1;min-height:0;overflow:hidden;border-radius:8px;background:#0f1a1f;padding:6px 8px}
#bPerfil{display:none}
/* ---------- Mesa ---------- */
.mesa{min-width:0;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:var(--gap)}
.fila{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:#0005;border:2px solid #ffffff1a}
.fila .lbl{display:flex;flex-direction:column;gap:2px;flex:none}
.fila .lbl small{font-size:14px;text-transform:none;letter-spacing:0;color:var(--bone-dim)}
.reserva{display:flex;gap:8px;flex:1;justify-content:center;--cw:var(--rw)}
/* La carta: cuerpo color hueso, franja con el color de la rareza, la ficha al centro */
.carta{position:relative;flex:none;width:var(--cw);height:calc(var(--cw) * 1.38);border-radius:calc(var(--cw) * .09);background:linear-gradient(#fbf3e2,#e8dcc2);border:2px solid #2a1a0a;
  box-shadow:0 5px 0 #0007,0 8px 14px #0006;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:transform .18s;--ch:calc(var(--cw) * .72)}
.carta::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--cw) * .14);border-radius:calc(var(--cw) * .07) calc(var(--cw) * .07) 0 0;background:var(--rc,#a9adb3)}
.carta.vacio{background:#0003;border:2px dashed #ffffff44;box-shadow:none}
.carta.vacio::before{display:none}
.carta .cara{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:calc(var(--cw) * .1)}
.carta .cn{display:none;font:700 14px/1.05 var(--hud);color:#2a1a0a;text-align:center;padding:0 4px}
.carta.rC{--rc:#8a8e94}.carta.rB{--rc:#2e9a4a}.carta.rA{--rc:#2f6fd8}.carta.rS{--rc:linear-gradient(90deg,#c8901a,#ffd27a,#c8901a)}
.carta.rS{border-color:#8a5a00;box-shadow:0 5px 0 #0007,0 0 16px #ffc43a88}
/* La mano: abanico */
.mano-zona{display:flex;flex-direction:column;gap:2px;align-items:center}
.mano-zona .lbl small{font-size:14px;text-transform:none;letter-spacing:0;color:var(--bone-dim)}
.mano{display:flex;justify-content:center;align-items:flex-end;padding:22px 10px 26px;--cw:var(--mw)}
.mano .carta{margin:0 calc(var(--solape) * -1);transform:translateY(calc(var(--y) * 1px)) rotate(calc(var(--r) * 1deg));transform-origin:50% 120%}
.mano .carta.elegida{transform:translateY(-20px) rotate(0deg) scale(1.06);z-index:3}
.mano .carta:hover{z-index:2}
/* Detalle: carta grande + texto + botones */
.det{min-height:0;display:flex;gap:14px;align-items:center;padding:8px 12px;border-radius:12px;background:#0b1f15cc;border:1px solid #ffffff22;overflow:hidden}
.det .grande{--cw:var(--gw);flex:none}
.det .grande .carta{cursor:default}
.det .grande .cn{display:block;font-size:clamp(14px,2.4vh,20px)}
.det .t{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:safe center;gap:4px;overflow:hidden}
.det .t>*{flex:none}
.det h2{font:400 clamp(20px,4vh,32px)/1.05 var(--display);color:var(--bone);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.det .rar{font-size:16px;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.det .d{font-size:16px;line-height:1.2}
.det .pr{font-size:14px;color:#8dffaa;font-weight:700}.det .sig{font-size:14px;color:var(--gold)}.det .donde{font-size:14px;color:var(--bone-dim)}
.det .vacio{font-size:16px;color:var(--bone-dim)}.det .vacio b{display:block;font:400 clamp(18px,3.2vh,26px) var(--display);color:var(--gold);margin-bottom:4px}
.acc{display:flex;flex-direction:column;gap:6px;flex:none;width:clamp(130px,16vw,190px)}
.acc .btn{padding:0 8px}
/* Perfil completo encima de la mesa (teléfono) */
.hoja{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#000a;padding:12px}
.hoja[hidden]{display:none}
.hoja .pj{width:min(560px,100%);max-height:100%}
.hoja .cerrar{flex:none}
/* ---------- Medidas ---------- */
:root{--rw:min(76px,10vh);--mw:min(118px,19vh,calc((100vw - 330px)/8.2));--gw:min(150px,20vh);--solape:4px}
.carta .cn{display:none}
@media (min-height:560px) and (orientation:landscape){.mano .cn{display:block}.det .d{font-size:20px}.det .rar,.det .pr,.det .sig,.det .donde{font-size:17px}}
@media (max-height:500px){
  :root{--izq:184px;--rw:42px;--mw:56px;--gw:60px;--solape:2px}
  .lay .pj .minis,.lay .pj .lbl,.lay .pj .objs,.lay .pj .info{display:none}
  #bPerfil{display:flex}.pj{gap:6px;padding:6px}.pj-hd img{width:46px}.bx{min-height:44px}
  .fila{padding:3px 8px}.fila .lbl small{display:none}.mano{padding:10px 6px 16px}.mano .carta.elegida{transform:translateY(-10px) scale(1.04)}
  .mano-zona .lbl{display:none}
  .hoja .pj{width:min(760px,100%);display:grid;grid-template-columns:1fr 1fr;grid-auto-flow:column;grid-template-rows:auto auto 1fr;column-gap:12px}
  .hoja .pj .minis{grid-template-columns:1fr 1fr}.hoja .pj .lbl{grid-column:2;grid-row:1}.hoja .pj .objs{grid-column:2;grid-row:2}.hoja .pj .info{grid-column:2;grid-row:3}.hoja .cerrar{grid-column:1;grid-row:4}.hoja .pj .info{grid-row:3/5}
  .det{padding:4px 8px;gap:8px}.det .d{font-size:14px}.det h2{font-size:18px}.acc{flex-direction:row;width:auto}.acc .btn{min-width:84px;padding:0 6px}
}
@media (orientation:portrait){
  .top{flex-wrap:wrap;row-gap:6px;gap:6px}.top h1{flex:1 1 auto;order:-2;font-size:22px}.top .main{order:-1}.top .sp{display:none}.top .pill{padding:0 8px}#pills{flex:1}
  :root{--rw:calc((100vw - 120px)/6);--mw:min(70px,calc((100vw - 76px)/6.2));--gw:76px;--solape:6px}
  .lay{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .lay .pj{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px}
  .lay .pj .minis,.lay .pj .lbl,.lay .pj .objs,.lay .pj .info{display:none}
  .lay .pj .pj-hd{flex:1 1 140px}.lay .pj .bxs{flex:1 1 130px}#bPerfil{display:flex;flex:1 1 100%}
  .fila{flex-direction:column;align-items:stretch;gap:4px}.fila .lbl{flex-direction:row;justify-content:space-between}.reserva{gap:6px}
  .det{flex-wrap:wrap;gap:8px;align-content:center;padding:8px}.det .t{min-height:0;max-height:calc(100% - 60px)}
  .acc{flex-direction:row;width:100%}.acc .btn{flex:1;min-width:0}
  .det .grande .cn{display:none}.mano-zona .lbl small{display:none}
}
</style></head><body><div class="frame">
<div class="top"><a class="btn" href="inventario_encuesta.html">Diseños</a><h1>Inventario</h1><span class="sp"></span><span id="pills"></span><button class="btn main" id="bVolver">Volver al juego</button></div>
<div class="lay">
 <div class="pj" id="pj"></div>
 <div class="mesa">
  <div class="fila"><div class="lbl">Reserva <b id="cRes"></b><small>no dan efecto</small></div><div class="reserva" id="res"></div></div>
  <div class="det"><div class="grande" id="grande"></div><div class="t" id="txt"></div>
   <div class="acc"><button class="btn" id="bMover"></button><button class="btn" id="bJuntar"></button><button class="btn" id="bVender" data-drop="vender"></button></div></div>
  <div class="mano-zona"><div class="lbl">Cinturón <b id="cCin"></b> · tu mano <small>· estas dan efecto</small></div><div class="mano" id="cin"></div></div>
 </div>
</div>
<div class="hoja" id="hoja" hidden><div class="pj" id="pjFull"></div></div>
</div>
<script>
let hojaAbierta = false;
function carta(l, i, n) {
  const x = Z.get(l), par = x && Z.pareja(l);
  const fan = n ? `--r:${((i - (n - 1) / 2) * 3.2).toFixed(1)};--y:${(Math.abs(i - (n - 1) / 2) ** 2 * 1.2).toFixed(1)}` : '';
  return `<span class="carta${x ? ' r' + rareza(x.id) : ' vacio'}${par ? ' par' : ''}" data-loc="${l}" style="${fan}">${x ? `<span class="cara">${ficha(x.id, x.nv)}<b class="cn">${nombre(x.id)}</b></span>` : ''}</span>`;
}
function panelPerfil(completo) {
  const P = perfil(), o = INV.obj && P.objetos.find(x => x.k === INV.obj), s = INV.stat && P.stats.find(x => x.k === INV.stat);
  const st = k => P.stats.find(x => x.k === k);
  return `<div class="pj-hd"><img src="${P.pj.foto}" alt="${P.pj.nombre}"><div><b>${P.pj.nombre}</b><span>${P.pj.arma}</span><span>Pasiva: ${P.pj.pasiva}</span></div></div>
    <div class="bxs"><div class="bx rojo${INV.stat === 'dano' ? ' on' : ''}" data-st="dano"><small>Daño</small><b>${st('dano').v}</b></div><div class="bx azul${INV.stat === 'suerte' ? ' on' : ''}" data-st="suerte"><small>Suerte</small><b>${st('suerte').v}</b></div></div>
    <div class="minis">${['vida', 'disp', 'caja', 'efec'].map(k => `<div class="mini${INV.stat === k ? ' on' : ''}" data-st="${k}"><small>${st(k).t}</small><b>${st(k).v}</b></div>`).join('')}</div>
    <div class="lbl">Objetos del misterio</div>
    <div class="objs">${P.objetos.map(x => `<span class="obj${x.tiene ? '' : ' no'}${x.k === INV.obj ? ' on' : ''}" data-obj="${x.k}" title="${x.nombre}">${objetoSVG(x.k)}</span>`).join('')}</div>
    <div class="info"><div class="d">${o ? `<b>${o.nombre}</b> · ${o.tiene ? o.tipo : 'No lo tienes'}. ${o.d}` : s ? `<b>${s.t}: ${s.v}</b>. ${s.d}` : `Toca un número o un objeto. <b>Ultimate: ${P.pj.ulti}.</b> ${P.pj.ultiD}`}</div></div>
    ${completo ? '<button class="btn cerrar" id="bCerrar">Cerrar</button>' : '<button class="btn" id="bPerfil">Perfil completo</button>'}`;
}
function pintar2() {
  $('#pj').innerHTML = panelPerfil(false); encajar($('#pj .info'));
  $('#hoja').hidden = !hojaAbierta; if (hojaAbierta) { $('#pjFull').innerHTML = panelPerfil(true); encajar($('#pjFull .info')); }
  $('#res').innerHTML = Z.e.inv.map((_, i) => carta('inv:' + i)).join(''); $('#cRes').textContent = cuenta('inv');
  $('#cin').innerHTML = Z.e.cin.map((_, i) => carta('cin:' + i, i, 8)).join(''); $('#cCin').textContent = cuenta('cin');
  const D = INV.sel && detalle(INV.sel), T = $('#txt');
  if (!D) {
    $('#grande').innerHTML = '';
    T.innerHTML = `<div class="vacio"><b>${INV.cambio ? 'Elige con cuál cambiarla' : 'Toca una carta'}</b>Las que brillan en verde tienen pareja: 2 iguales del mismo nivel = 1 del nivel siguiente.</div>`; encajar(T); return;
  }
  $('#grande').innerHTML = carta(INV.sel).replace('data-loc=', 'data-x=').replace(' par', '');
  T.innerHTML = `<h2>${D.nombre}</h2><div class="rar"><span style="color:${D.rcol}">${D.rar}</span>${pips(D.nv)}<span>Nv ${D.nv} de 4</span></div><div class="d">${D.ahora}</div>${D.par ? `<div class="pr">${D.par}</div>` : ''}<div class="donde opc">${INV.cambio ? 'Toca la carta con la que quieres cambiarla.' : D.donde}</div><div class="sig opc">${D.sig}</div>`;
  encajar(T);
}
iniciarInv({ render: pintar2, root: $('.lay') });
// al juntar, la carta que queda da una vuelta completa
INV.alJuntar = el => { el?.querySelector('.cara')?.animate([{ transform: 'rotateY(0)' }, { transform: 'rotateY(180deg) scale(1.15)' }, { transform: 'rotateY(360deg)' }], { duration: 650, easing: 'ease-in-out' }); Son.whoosh(); };
const clicPerfil = e => {
  if (e.target.closest('#bPerfil')) { hojaAbierta = true; Son.clic(); render(); return; }
  if (e.target.closest('#bCerrar') || e.target.id === 'hoja') { hojaAbierta = false; Son.clic(); render(); return; }
  const o = e.target.closest('[data-obj]'), s = e.target.closest('[data-st]');
  if (o) { INV.obj = o.dataset.obj; INV.stat = null; } else if (s) { INV.stat = s.dataset.st; INV.obj = null; } else return;
  Son.ficha(); render(); FX.rebote(e.currentTarget.querySelector(o ? `[data-obj="${INV.obj}"]` : `[data-st="${INV.stat}"]`), 1.12);
};
$('#pj').onclick = clicPerfil; $('#hoja').onclick = clicPerfil;
</script></body></html>
