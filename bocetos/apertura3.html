<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apertura 3</title><link rel="stylesheet" href="base.css"><script src="fichas.js"></script><script src="sobres.js"></script><style>body{padding:16px;background:#140f0a}h1{font:400 28px var(--display);color:var(--gold);margin-bottom:4px}.d{font-size:18px;color:var(--bone-dim);margin-bottom:12px}

<h1 id="h"></h1><div class="d" id="d"></div><div class="s" id="s"></div>
<script>const A=APERTURAS[2];document.getElementById('h').textContent='Apertura '+A.n+' · '+A.name;document.getElementById('d').textContent=A.d+' (con el sobre '+A.n+')';
